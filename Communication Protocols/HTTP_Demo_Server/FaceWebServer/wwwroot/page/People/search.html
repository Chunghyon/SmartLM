<style>

    .aligncenter {
        display: flex;
        justify-content: center;
        align-items: center;
    }
</style>

<div class="layuimini-main" id="admin-search">

    <form class="layui-form layui-form-pane" lay-filter="people_search_div_filter">
        <div class="layui-form-item">
            <div class="layui-inline">
                <label class="layui-form-label">
                    <span language="people.p51">人员编号</span>
                </label>
                <div class="layui-input-inline">
                    <input type="number" max="4294967295" min="1" maxlength="10" name="UserID" autocomplete="off"
                           class="layui-input">
                </div>
            </div>
            <div class="layui-inline">
                <label class="layui-form-label">
                    <span language="people.p52">人员姓名</span>
                </label>
                <div class="layui-input-inline">
                    <input type="text" maxlength="30" name="Name" autocomplete="off" class="layui-input">
                </div>
            </div>


        </div>
        <div class="layui-form-item">
            <div class="layui-inline">
                <label class="layui-form-label">
                    <span language="people.job">职务</span>
                </label>
                <div class="layui-input-inline">
                    <input type="text" maxlength="30" name="Job" autocomplete="off" class="layui-input">
                </div>
            </div>
            <div class="layui-inline">
                <label class="layui-form-label">
                    <span language="people.dept">部门</span>
                </label>
                <div class="layui-input-inline">
                    <input type="text" maxlength="30" name="Department" autocomplete="off" class="layui-input">
                </div>
            </div>


        </div>
        <div class="layui-form-item">
            <div class="layui-inline">
                <label class="layui-form-label">
                    <span language="people.p53">卡号</span>
                </label>
                <div class="layui-input-inline">
                    <input type="number"
                           max="18446744073709550000"
                           min="0"
                           maxlength="20"
                           name="CardNum"
                           value=""
                           class="layui-input" />
                </div>
            </div>
            <div class="layui-inline">
                <label class="layui-form-label">
                    <span language="people.p37">身份证</span>
                </label>
                <div class="layui-input-inline">
                    <input type="text" maxlength="30" name="IdentityCard" autocomplete="off" class="layui-input">
                </div>
            </div>


        </div>
        <div class="layui-form-item">
            <div class="layui-inline">
                <label class="layui-form-label">
                    <span language="people.QRCode">二维码</span>
                </label>
                <div class="layui-input-inline">
                    <input type="text" maxlength="100" name="QRCode" autocomplete="off" class="layui-input">
                </div>
            </div>
            <div class="layui-inline">
                <label class="layui-form-label">
                    <span language="people.regQRCode">登记二维码</span>
                </label>
                <div class="layui-input-inline selectUp">
                    <select name="UseQRCode" required lay-verify="">
                        <option value="" selected></option>
                        <option value="1" language='people.p57'>已登记</option>
                        <option value="2" language='people.p58'>未登记</option>
                    </select>

                </div>
            </div>


        </div>
        <div class="layui-form-item">

            <div class="layui-inline">
                <label class="layui-form-label">
                    <span language="people.p55">登记照片</span>
                </label>
                <div class="layui-input-inline selectUp">
                    <select name="Photo" required lay-verify="">
                        <option value="" selected></option>
                        <option value="1" language='people.p57'>已登记</option>
                        <option value="2" language='people.p58'>未登记</option>
                    </select>

                </div>
            </div>
            <div class="layui-inline">
                <label class="layui-form-label">
                    <span language="people.regPassword">登记密码</span>
                </label>
                <div class="layui-input-inline selectUp">
                    <select name="Password" required lay-verify="">
                        <option value=""  selected></option>
                        <option value="1" language='people.p57'>已登记</option>
                        <option value="2" language='people.p58'>未登记</option>
                    </select>

                </div>
            </div>
        </div>
        <div class="layui-form-item">

            <div class="layui-inline">
                <label class="layui-form-label">
                    <span language="people.regFace">登记人脸特征码</span>
                </label>
                <div class="layui-input-inline selectUp">
                    <select name="Face" required lay-verify="">
                        <option value="" selected></option>
                        <option value="1" language='people.p57'>已登记</option>
                        <option value="2" language='people.p58'>未登记</option>
                    </select>

                </div>
            </div>
            <div class="layui-inline">
                <label class="layui-form-label">
                    <span language="people.regFP">登记指纹</span>
                </label>
                <div class="layui-input-inline selectUp">
                    <select name="Fingerprints" required lay-verify="">
                        <option value="" selected></option>
                        <option value="1" language='people.p57'>已登记</option>
                        <option value="2" language='people.p58'>未登记</option>
                    </select>

                </div>
            </div>
        </div>
        <div class="layui-form-item">

            <div class="layui-inline">
                <label class="layui-form-label">
                    <span language="people.regPalm">登记掌静脉</span>
                </label>
                <div class="layui-input-inline selectUp">
                    <select name="Palmveins" required lay-verify="">
                        <option value="" selected></option>
                        <option value="1" language='people.p57'>已登记</option>
                        <option value="2" language='people.p58'>未登记</option>
                    </select>

                </div>
            </div>
        </div>
        <div class="layui-form-item aligncenter">
            <div class="layui-inline">
                <button type="submit" class="layui-btn layui-btn-primary" lay-submit lay-filter="data-search-btn">
                    <i class="layui-icon">&#xe615;</i>
                    <span language="people.p60">搜索</span>
                </button>
                <button type="reset" class="layui-btn layui-btn-primary">
                    <span language="people.p61">重置</span>
                </button>
                <button type="submit" class="layui-btn layui-btn-primary" id="btnsearchclose">
                    <i class="layui-icon">&#x1006;</i>
                    <span language="people.p62">取消</span>
                </button>
            </div>
        </div>
    </form>

</div>
<script>
    setLanguage();
    setAllAttrVal()
    layui.use(['form', 'table', 'faceAPI'], function () {
        var form = layui.form,
            layer = layui.layer,
            table = layui.table,
            $ = layui.$;
        var faceAPI = layui.faceAPI;
        /**
         * 初始化表单，要加上，不然刷新部分组件可能会不加载
         */
        form.render();

        // 当前弹出层，防止ID被覆盖
        var parentIndex = layer.index;

        if (faceAPI.PeopleSearchPageResult != null) {
            form.val("people_search_div_filter", faceAPI.PeopleSearchPageResult.field);
        } else
            faceAPI.PeopleSearchPageResult = {};

        faceAPI.PeopleSearchPageResult.Result = false;
        //监听提交
        form.on('submit(data-search-btn)', function (data) {
            var result = data.field;


            if (result.UserID == "")  result['UserID'] = null;
            if (result.Name == "") result['Name'] = null;

            if (result.Job == "")  result['Job'] = null;
            if (result.Department == "") result['Department'] = null;

            if (result.CardNum == "") result.CardNum = null;
            if (result.IdentityCard == "") result['IdentityCard'] = null;

            if (result.QRCode == "") result.QRCode = null;
            if (result.UseQRCode == "")
                result.UseQRCode = null;
            else
                result.UseQRCode = result.UseQRCode == "1" ? 1 : 0;


            if (result.Photo == "")
                result.Photo = null;
            else
                result.Photo = result.Photo == "1" ? 1 : 0;

            if (result.Password == "")
                result.Password = null;
            else
                result.Password = result.Password == "1" ? 1 : 0;

            

            if (result.Face == "")
                result.Face = null;
            else
                result.Face = result.Face == "1" ? 1 : 0;

            

            if (result.Fingerprints == "")
                result.Fingerprints = null;
            else
                result.Fingerprints = result.Fingerprints == "1" ? 1 : 0;

            if (result.Palmveins == "")
                result.Palmveins = null;
            else
                result.Palmveins = result.Palmveins == "1" ? 1 : 0;

            faceAPI.PeopleSearchPageResult.Result = true;
            faceAPI.PeopleSearchPageResult.field = result;
            layer.close(parentIndex);
            return false;
        });


        $('#btnsearchclose').on('click', function () {
            faceAPI.PeopleSearchPageResult.Result = false
            layer.close(parentIndex);
            return false;
        });

        faceAPI.CheckInputBox();

    });

</script>
