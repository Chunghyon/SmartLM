<script>
    setLanguage();
    setAllAttrVal();


    layui.use(
        ["form", "upload", "table", "miniPage", "faceAPI", "slider", "laydate"],
        function () {
            // debugger
            var $ = layui.jquery;
            var form = layui.form,
                layer = layui.layer,
                miniPage = layui.miniPage,
                table = layui.table;
            var faceAPI = layui.faceAPI;
            var imageTool = ImageUtility();
            var laydate = layui.laydate;
            var TimeGroups = [];
            var parentIndex = layer.index;
            var bIsNew = true;
            var peopleDetail = {};
            faceAPI.PeopleEditPageResult = {};

            //初始化表单，要加上，不然刷新部分组件可能会不加载
            form.render();

            var formDataobj = {};

            var peopleEdit = {
                setParentIndex(index) {
                    parentIndex = index;
                },

 
                //创建时段下拉框
                createTimeGroup: function (name) {
                    for (var i = 1; i < 65; i++) {
                        var sItem = ' <option value="' + i + '" ';
                        if (i == 1) sItem += " selected";
                        sItem += `> ${getLanguage("access.a94")}` + i + "</option> ";
                        TimeGroups.push(sItem);
                    }
                    $("[name=" + name + "]").html(TimeGroups.join(""));

                    form.render("select");
                },


                //创建时间控件
                createLaydate(name, value) {
                    laydate.render({
                        elem: '[name="' + name + '"]', //指定元素
                        type: "datetime",
                        format: 'yyyy-MM-dd HH:mm:ss',
                        min: '2024-01-01',
                        max: '2099-12-31 23:59:59',
                        fullPanel: true

                    });
                    $('[name="' + name + '"]').attr("value", value);
                },
                /**
                 * 创建表格
                 * @param {*} elem  tableid
                 * @param {*} title  标题
                 * @param {*} data  数据
                 */
                CreateTable(elem, title, data) {
                    table.render({
                        elem: "#" + elem,
                        cols: [
                            [
                                //标题栏
                                { type: "checkbox", width: 60 },
                                { field: "num", title: title },
                            ],
                        ],
                        data: data,
                        height: 430,
                        limit: 1000, // 每页默认显示的数量
                    });
                    return table;
                },
                //创建表格数据
                CreateTableData: function (len, checked) {
                    if (checked == undefined) checked = [];
                    var data = [];
                    for (var i = 1; i <= len; i++)
                        data.push({
                            LAY_CHECKED: checked.includes(i.toString()),
                            num: i,
                        });
                    return data;
                },
                createfeatureTabel: function (data) {
                    //var fieldtype = getLanguage("people.p101");
                    var fielddata = getLanguage("people.p103");
                    //var fieldnum = getLanguage("people.p102");
                    var fieldAction = getLanguage("people.p104");
                    var that = this;
                    var tableId = "Table_feature";
                    table.render({
                        elem: "#Table_feature",
                        cols: [
                            [
                                {
                                    type: "checkbox",
                                    width: 50
                                },
                                //标题栏
                                { field: "Name", title: fielddata },
                                { title: fieldAction, width: 200, toolbar: "#featureTableBar" },
                            ],
                        ],
                        done: function (res, curr, count) {
                            setLanguage();
                        },

                        data: data,
                        height: 430,
                        limit: 60, // 每页默认显示的数量
                    });

                    $('#BtnFeatureAdd').off('click');
                    $('#BtnFeatureAdd').on('click', function () {
                        var content = miniPage.getHrefContent(
                            "page/People/AddFeature.html"
                        );

                        var Features = layui.table.cache[tableId];

                        faceAPI.PeopleFeatureWindowData = { Save: false, Features: Features }

                        // debugger;
                        var layerindex = layer.open({
                            title: getLanguage("people.AddFeatureCode"),
                            type: 1,
                            shade: 0.2,
                            // maxmin: true,
                            shadeClose: true,
                            area: ["800px", "730px"],

                            content: content,
                            end: function () {
                                if (faceAPI.PeopleFeatureWindowData.Save) {
                                    table.reload(tableId, { data: faceAPI.PeopleFeatureWindowData.Features });
                                }

                            },
                        });
                        return false;
                    });
                    $('#BtnFeatureDelete').off('click');
                    $('#BtnFeatureDelete').on('click', function () {
                        //debugger
                        var checkStatus = table.checkStatus(tableId),
                            data = checkStatus.data;
                        var features = [];

                        data.forEach(function (item, index) {

                            features[item.Type + "_" + item.Num] = 1;
                        });
                        if (data.length == 0) {
                            layer.alert(getLanguage('people.DeleteFeatureCodeErr'), { icon: 2 });
                            return false;
                        }

                        var oldDatas = layui.table.cache[tableId];
                        var oldDatesLen = oldDatas.length;
                        for (var i = oldDatesLen - 1; i >= 0; i--) {
                            console.log(oldDatas[i]);

                            var strKey = oldDatas[i].Type + "_" + oldDatas[i].Num;


                            if (features[strKey] == 1) {
                                oldDatas.splice(i, 1);
                            }

                        }
                        console.log("刷新表格")
                        table.reload(tableId, { data: oldDatas });
                        return false;
                    });

                    $('#BtnFeatureClear').off('click');
                    $('#BtnFeatureClear').on('click', function () {
                        table.reload(tableId, { data: [] });
                        return false;
                    });
                    $('#BtnEnrollUserOnDevice').off('click');
                    $('#BtnEnrollUserOnDevice').on('click', function () {
                        var content = miniPage.getHrefContent(
                            "page/People/SelectFeature.html"
                        );



                        faceAPI.PeopleFeatureWindowData = { Save: false }

                        // debugger;
                        var layerindex = layer.open({
                            title: getLanguage("people.SelectEnrollFeature"),
                            type: 1,
                            shade: 0.2,
                            // maxmin: true,
                            shadeClose: true,
                            area: ["580px", "450px"],

                            content: content,
                            end: function () {
                                if (faceAPI.PeopleFeatureWindowData.Save) {
                                    console.log(faceAPI.PeopleFeatureWindowData.type)
                                    var sRetType = faceAPI.PeopleFeatureWindowData.type;
                                    var iDataType = 1;
                                    var iIndex = 1;
                                    if (sRetType != "Face") {

                                        iDataType = 2;//指纹
                                        iIndex = 0;
                                        if (sRetType == "Palm") {
                                            iDataType = 3;//掌静脉
                                            iIndex = 1;
                                        }

                                        var bFind = true;

                                        //获取注册特征的索引号
                                        var oldDatas = layui.table.cache[tableId];
                                        var oldDatesLen = oldDatas.length;
                                        do {
                                            bFind = true;
                                            for (var i = 0; i < oldDatesLen; i++) {

                                                if (oldDatas[i].Type == iDataType &&
                                                    oldDatas[i].Num == iIndex) {
                                                    iIndex++;//被占用，跳过
                                                    bFind = false;
                                                    break;
                                                }

                                            }
                                            if (bFind) break;
                                        } while (true);
                                        if (sRetType == "Palm") {
                                            if (iIndex > 2) {
                                                layer.alert(getLanguage("people.PalmCountError"), { icon: 2 });
                                                return false;
                                            }
                                        }
                                        if (sRetType == "FP") {
                                            if (iIndex > 2) {
                                                layer.alert(getLanguage("people.FingerprintCountError"), { icon: 2 });
                                                return false;
                                            }
                                        }
                                    }


                                    //通知设备
                                    EnrollUserMediaData(sRetType, iIndex);
                                }

                            },
                        });
                        return false;
                    });


                    table.on("tool(ID-table-feature)", function (obj) {
                        var data = obj.data;

                        if (obj.event === "edit") {
                            //显示特征码详情
                            that.openFeatureWindow(tableId, data);
                        } else if (obj.event === "delete") {
                            //删除特征码
                            layer.alert(
                                getLanguage("people.DeleteFeatureTip") + "[" + data.Name + "]?",
                                { icon: 3 },
                                function (alertindex) {
                                    var oldDatas = layui.table.cache[tableId];
                                    var oldDatesLen = oldDatas.length;
                                    for (var i = 0; i < oldDatesLen; i++) {

                                        if (oldDatas[i].Type == data.Type &&
                                            oldDatas[i].Num == data.Num) {
                                            oldDatas.splice(i, 1);
                                            break;
                                        }

                                    }

                                    table.reload(tableId, { data: oldDatas });
                                    layer.close(alertindex);
                                }
                            );
                        }
                        return false;
                    });
                },
                /**
                 *
                 * 根据用户ID获取用户信息
                 */
                GetUserDetail: function () {
                    var that = this;
                    if (faceAPI.PeopleEditPage == undefined) {
                        
                        this.createfeatureTabel([]);
                        peopleDetail.PhotoLen = 0;
                        peopleDetail.PhotoMD5 = "";
                        peopleDetail.Photo = "";

                        var fromdata = {
                            ExpirationDate: "2099-12-31 00:00:00",
                            OpenTimes: 65535,
                        };
                        form.val("people_edit_div_filter", fromdata);


                        //获取新用户ID
                        var loadIndex = layer.load(1, { shade: [0.6, "#e2e2e2"] }); //0.1透明度的白色背景
                        faceAPI.AjaxPOSTJson({
                            url: "/api/People/GetNewID",
                            success: function (result) {
                                layer.close(loadIndex);
                                fromdata.UserID = result.Content.NewUserID;
                                form.val("people_edit_div_filter", fromdata);
                            },
                        });
                        bIsNew = true;
                        return;
                    }
                    var loadIndex = layer.load(1, { shade: [0.6, "#e2e2e2"] }); //0.1透明度的白色背景
                    faceAPI.AjaxPOSTJson({
                        url: "/api/People/GetDetail",
                        data: { UserID: faceAPI.PeopleEditPage.UserID },
                        success: function (result) {
                            layer.close(loadIndex);
                            bIsNew = false;
                            that.formBind(result);
                        },
                    });
                },
                /**
                 *
                 * 设置表单对象
                 * @param {any} result
                 */
                formBind: function (result) {
                    if (result.Result == false) {
                        layer.alert(result.Error, { icon: 2 });
                        layer.close(parentIndex);
                        return;
                    }


                    peopleDetail = result.Content;


                    //加载完毕
                    var fromdata = peopleDetail;
                    form.val("people_edit_div_filter", peopleDetail);
                    if (fromdata.hasOwnProperty("QRCode") == true)
                        makeCode(fromdata.QRCode);

                    var that = this;
                    if (fromdata.PhotoLen != undefined && fromdata.PhotoLen > 0) {
                        $("#peopleImage").find("img").remove();

                        //测量一下文件尺寸
                        const img = new Image();
                        img.src = fromdata.Photo;
                        img.onload = function () {
                            console.log("图片尺寸：" + img.width + '*' + img.height)
                            var url = compressAndUploadImage(img, 240, 320);

                            $('#peopleImage').append('<img id="showPeopleImg" bigimg= "' + fromdata.Photo + '" src="' + url +
                                '" width= "' + 240 + '"  height= "' + 320 + '" >');
                            //图片预览
                            that.previewPictureClick("showPeopleImg");
                        }
                    }


                    var featureDatas = [];
                    var featureName = getLanguage("people.p96");
                    
                    //人脸特征码
                    if (
                        fromdata.FaceFeature != undefined &&
                        fromdata.FaceFeature.Data.length > 0
                    ) {
                        fromdata.FaceFeature.Type = 1;
                        fromdata.FaceFeature.Num = 1;
                        fromdata.FaceFeature.Name = getLanguage("people.FaceFeature");

                        featureDatas.push(fromdata.FaceFeature);
                    }

                    //指纹特征码
                    if (
                        fromdata.Fingerprints != undefined &&
                        fromdata.Fingerprints.length > 0
                    ) {
                        for (var i = 0; i < fromdata.Fingerprints.length; i++) {
                            fromdata.Fingerprints[i].Type = 2;
                            fromdata.Fingerprints[i].Name = featureName + fromdata.Fingerprints[i].Num;
                            featureDatas.push(fromdata.Fingerprints[i]);
                        }
                    }

                    //掌静脉特征码
                    var palmName = getLanguage("people.p97");
                    if (
                        fromdata.Palmveins != undefined &&
                        fromdata.Palmveins.length > 0
                    ) {
                        for (var i = 0; i < fromdata.Palmveins.length; i++) {
                            fromdata.Palmveins[i].Type = 3;
                            fromdata.Palmveins[i].Name = palmName + fromdata.Palmveins[i].Num;
                            featureDatas.push(fromdata.Palmveins[i]);
                        }
                    }

                    this.createfeatureTabel(featureDatas);
                },
                /**
                 * 创建图片上传控件
                 * @param {any} elem
                 */
                createUpload: function (elem) {
                    var that = this;
                    var upload = layui.upload;
                    //选择照片
                    var uploadInst = upload.render({
                        elem: "#" + elem, //绑定元素
                        url: "/upload/", //上传接口
                        auto: false,
                        accept: "images",
                        acceptMime: "image/jpg",
                        choose: function (obj) {
                            //将每次选择的文件追加到文件队列
                            var files = obj.pushFile();

                            //预读本地文件，如果是多文件，则会遍历。(不支持ie8/9)
                            obj.preview(function (index, file, result) {
                                var _URL = window.URL || window.webkitURL;
                                let imgbase = _URL.createObjectURL(file);
                                window.sessionStorage.setItem("imgEdit", imgbase);
                                var content = miniPage.getHrefContent(
                                    "page/People/EditImage.html"
                                );
                                faceAPI.PeopleEditImageResult = false;
                                layer.open({
                                    // title: '拍摄',

                getFormData: function (postdata) {

                    var formData = imageTool.getFormData();
                    
                    //获取照片
                    if ($(showPeopleImg)[0].currentSrc.slice(0, 5) == "data:") {
                        var imgBuf = imageTool.imageBase64ToBuffer(showPeopleImg);

                        // 将 Uint8Array 转换为 WordArray
                        const wordArray = CryptoJS.lib.WordArray.create(imgBuf);
                        postdata.PhotoMD5 = CryptoJS.MD5(wordArray).toString(
                            CryptoJS.enc.Hex
                        );
                        var imgFile = imageTool.getFile(imgBuf, postdata.UserID);
                        formData.append("Photo", imgFile);
                        postdata.PhotoLen = imgBuf.length;
                        postdata.Photo = imgFile.name;
                    } else {
                        if (peopleDetail != undefined) {
                            postdata.Photo = peopleDetail.Photo;
                            postdata.PhotoLen = peopleDetail.PhotoLen;
                            postdata.PhotoMD5 = peopleDetail.PhotoMD5;
                        } 
                    }

                    

                    postdata.Fingerprints = [];
                    postdata.Palmveins = [];
                    //postdata.FaceFeature = undefined;

                    var oldDatas = layui.table.cache["Table_feature"];
                    for (var i = 0; i < oldDatas.length; i++) {
                        switch (oldDatas[i].Type) {
                            case 1: //人脸特征码
                                postdata.FaceFeature = oldDatas[i];
                                break;
                            case 2: //指纹特征码

                                break;
                            case 3: //掌静脉特征码

                                break;
                            default:
                        }

                    formDataobj = postdata;
                    formData.append("PeopleJson", JSON.stringify(postdata));

            function resizeImage(img, maxWidth, maxHeight) {
                let width = img.width;
                let height = img.height;

                // 计算宽高比
                var aspectRatio1 = maxWidth / width;
                var aspectRatio2 = maxHeight / height;

                if (aspectRatio1 > aspectRatio2) {
                    aspectRatio1 = aspectRatio2
                }
                height = Math.round(height * aspectRatio1);
                width = Math.round(width * aspectRatio1);

                return { width, height };
            }

            function compressAndUploadImage(img, maxWidth, maxHeight) {

                const canvas = document.createElement('canvas');
                const ctx = canvas.getContext('2d');

                const newSize = resizeImage(img, maxWidth, maxHeight);

                canvas.width = maxWidth;
                canvas.height = maxHeight;
                // 设置背景色
                ctx.fillStyle = '#FFFFFF'; // 你可以将颜色值改为你需要的背景色
                ctx.fillRect(0, 0, canvas.width, canvas.height);

                // 计算图像居中的位置
                const offsetX = (maxWidth - newSize.width) / 2;
                const offsetY = (maxHeight - newSize.height) / 2;

                ctx.drawImage(img, offsetX, offsetY, newSize.width, newSize.height);
                //console.log('图片最终尺寸:', newSize);
                // 返回压缩后的图片
                const previewUrl = canvas.toDataURL('image/jpeg', 1);

                return previewUrl;
            }
