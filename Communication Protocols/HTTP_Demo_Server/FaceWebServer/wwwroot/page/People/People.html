<div class="layuimini-container layuimini-page-anim" divname="admin">
    <style>
        .auto-wrap {
            word-wrap: break-word; /* 或者使用 overflow-wrap: break-word; */
            white-space: normal;
            word-break: break-all;
        }
    </style>
    <div class="layuimini-main">

        <script type="text/html" id="toolbarDemo">
            <div class="layui-btn-container">
                <button class="layui-btn layui-btn-normal layui-btn-sm data-add-btn" lay-event="search">
                    <i class="layui-icon"></i> <span language="people.p1" tt="搜索"></span>
                </button>
                <button class="layui-btn layui-btn-normal layui-btn-sm data-add-btn" lay-event="add">
                    <span language="people.p2" tt="添加"></span>
                </button>
                <button class="layui-btn layui-btn-sm layui-btn-danger data-delete-btn" lay-event="delete">
                    <span language="people.p3" tt="删除"></span>
                </button>

                <button class="layui-btn layui-btn-sm layui-btn-danger data-delete-btn" lay-event="clear">
                    <span language="people.p6" tt="删除所有人员"></span>
                </button>
            </div>
        </script>

        <table class="layui-hide" id="PeoplePage" lay-filter="PeoplePageTableFilter"></table>

        <script type="text/html" id="currentTableBar">

    </div>

            miniPage = layui.miniPage;
        var faceAPI = layui.faceAPI;
        form.render();

        PeoplePageTable = table.render({
            elem: '#PeoplePage',
            //**************************异步请求开始***********************
            url: 'api/People/GetPeopleTable',
            method: 'post',
            contentType: "application/json",
            headers: {
                // token: 'sasasas',
                Authorization: "Bearer " + faceAPI.GetJWTToken()
            }, //增加Token验证头
            request: {
                pageName: 'PageIndex', //页码的参数名称，默认：page
                limitName: 'PageSize' //每页数据量的参数名，默认：limit
            },
            parseData: function (res) { //res 即为原始返回的数据
                if (res.ErrCode == 0) {
                    var data = res.Content;
                    var ret = {
                        "code": res.ErrCode, //解析接口状态
                        "msg": res.Error, //解析提示文本
                        "count": data.TotalCount, //解析数据长度
                        "data": data.DataList //解析数据列表
                    };
                    return ret;

                } else {
                    /*layer.open({
                        title: '请求错误',
                        content: '(' + res.ErrCode + ')' + res.Error
                    });  */

                    return {
                        "code": 0, //解析接口状态
                        "msg": '', //解析提示文本
                        "count": 0, //解析数据长度
                        "data": [] //解析数据列表
                    };
                }

        /**
         * toolbar事件监听
         */
        table.on('toolbar(PeoplePageTableFilter)', function (obj) {
            if (obj.event === 'add') { // 监听添加操作
                var content = miniPage.getHrefContent('page/People/edit.html');
                var openWH = miniPage.getOpenWidthHeight();
                faceAPI.PeopleEditPage = undefined;
                var index = layer.open({
                    title: getLanguage('people.p19'),
                    type: 1,
                    shade: 0.2,
                    maxmin: false,
                    shadeClose: false,
                    area: ['1050px', '700px'],
                    content: content,
                    end: function (layero, index) {

                        var rst = faceAPI.PeopleEditPageResult;
                        if (rst != null && rst.Result) {
                            faceAPI.PeopleSearchPageResult.field = {
                                ID: rst.Content.ID
                            };
                            refreshTable(false);
                        };

                    }
                });
            } else if (obj.event === 'delete') { // 监听删除操作
                var checkStatus = table.checkStatus('PeoplePage'),
                    data = checkStatus.data;
                var peopleIDs = [];
                //console.log(data);
                data.forEach(function (item, index) {

                    peopleIDs.push(item.ID);
                });
                if (peopleIDs.length == 0) {
                    layer.alert(getLanguage('people.p20'), {icon: 2});//请勾选需要删除的人员ID
                    return;
                }
                layer.confirm(getLanguage('people.p27') + '?', { icon: 3 }, function (index) {
                    layer.close(index);

                    faceAPI.AjaxPOSTJson({
                        data: {
                            PeopleIDs: peopleIDs
                        },
                        url: '/api/People/Delete',
                        success: function (result) {
                            if (result.Result == false) {
                                layer.alert(result.Error, {
                                    icon: 2
                                });
                            } else {

                                refreshTable(false);
                            }
                        }
                    });

                });
            } else if (obj.event === 'search') { // 查询操作
                var content = miniPage.getHrefContent('page/People/search.html');
                var openWH = miniPage.getOpenWidthHeight();

                var index = layer.open({
                    title: getLanguage('people.p21'),
                    type: 1,
                    shade: 0.2,
                    maxmin: false,
                    shadeClose: false,
                    area: ['700px', '550px'],
                    content: content,
                    end: function (layero, index) {

                        var rst = faceAPI.PeopleSearchPageResult;
                        if (rst != null && rst.Result) {
                            refreshTable(false);
                        };

                    }
                });
                $(window).on("resize", function () {
                    layer.full(index);
                });
            } else if (obj.event == 'refresh') {
                debugger;
                //执行搜索重载
                refreshTable(true);
            } else if (obj.event == 'input') {
                var content = miniPage.getHrefContent('page/People/input.html');
                var openWH = miniPage.getOpenWidthHeight();

                var index = layer.open({
                    title: getLanguage('people.p22'),
                    type: 1,
                    shade: 0.2,
                    maxmin: false,
                    shadeClose: false,
                    area: ['1200px', '850px'],
                    content: content,
                    end: function (layero, index) {

                        var rst = faceAPI.PeopleInputPageResult;
                        if (rst != null && rst.Result) {
                            refreshTable(true);
                        };

                    }
                });
            } else if (obj.event == 'clear') {
                ClearPeople();
            }
            setLanguage();
            setAllAttrVal()
        });

        function ClearPeople() {
            var layerindex = layer.confirm(getLanguage('people.p23'), {
                icon: 3,
                btn: [getLanguage('people.p24'), getLanguage('people.p25')] //按钮 删除和取消
            }, function () { //删除
                faceAPI.AjaxPOSTJson({
                    url: '/api/People/ClearPeople',
                    success: function (result) {
                        if (result.Result == false) {
                            layer.alert(result.Error, {
                                icon: 2
                            });
                        } else {
                            refreshTable(true);
                        }
                    }
                });
                layer.close(layerindex);

            });

        }

        function IniPeopleSearchField() {
            faceAPI.PeopleSearchPageResult = {};
            faceAPI.PeopleSearchPageResult.field = {
                ID: null,
                UserID: null,
                Name: null,
                Job: null,
                Department: null,
                IdentityCard: null,
                Photo: null,
                Password: null,
                CardNum: null,
                QRCode: null,
                UseQRCode: null,
                Face: null,
                Palmveins: null,
                Fingerprints: null,
            };
            faceAPI.PeopleSearchPageResult.Result = false;
        }



        function refreshTable(bIni) {
            if (bIni) {
                IniPeopleSearchField();
            }

            //PeoplePageTable.config
            table.reload('PeoplePage', {
                page: {
                    curr: 1
                },
                where: faceAPI.PeopleSearchPageResult.field
            }, 'data');
        }


        table.on('tool(PeoplePageTableFilter)', function (obj) {
            var data = obj.data;
            // debugger
            if (obj.event === 'edit') {

                var content = miniPage.getHrefContent('page/People/edit.html');
                var openWH = miniPage.getOpenWidthHeight();
                faceAPI.PeopleEditPage = data; //向layer页面传值，传值主要代码
                faceAPI.PeopleEditPageResult = null;
                var index = layer.open({
                    title: getLanguage('people.p26'),
                    type: 1,
                    shade: 0.2,
                    maxmin: false,
                    shadeClose: false,
                    area: ['1050px', '700px'],
                    content: content,
                    end: function (layero, index) {

                        //console.log(ImageUtility());

                        var rst = faceAPI.PeopleEditPageResult;

                        if (rst != null && rst.Result) {
                            IniPeopleSearchField()
                            faceAPI.PeopleSearchPageResult.field.ID= rst.Content.ID;
                            
                            refreshTable(false);
                        };

                    }
                });
                $(window).on("resize", function () {
                    layer.full(index);
                });
                return false;
            } else if (obj.event === 'delete') {

                layer.confirm(getLanguage('people.p27') + '[' + data.Name + ']?', { icon: 3 }, function (
                    index) {
                    var peopleIDs = [];
                    peopleIDs.push(data.ID);
                    faceAPI.AjaxPOSTJson({
                        data: {
                            PeopleIDs: peopleIDs
                        },
                        url: '/api/People/Delete',
                        success: function (result) {
                            if (result.Result == false) {
                                layer.alert(result.Error, {
                                    icon: 2
                                });
                            } else {
                                //刷新页面
                                refreshTable(false);
                            }

                        }
                    });


                    layer.close(index);
                });
            } else if (obj.event === 'fingerprint') { //指纹
                OpenFeatureWindow(getLanguage('people.p76'), obj.data.id, 1);//指纹数据操作
            } else if (obj.event === 'palmvein')//掌静脉
            {
                OpenFeatureWindow(getLanguage('people.p77'), obj.data.id, 0);//掌静脉据操作
            }
        });

        table.on('sort(PeoplePageTableFilter)', function (obj) {
            bindPeopleAccessKey();

        });

        function bindPeopleAccessKey() {
            $("[lay-id=PeoplePage] i.PeopleAccessKey").mouseenter(AccessKey_mouseenter);
            $("[lay-id=PeoplePage] i.PeopleAccessKey").mouseleave(() => {
                if (iMouseenter_TipIndex > 0)
                    layer.close(iMouseenter_TipIndex);
            });
        }

        // 在线离线状态显示提示框
        var iMouseenter_TipIndex = 0;

        function AccessKey_mouseenter() {
            var that = this;
            if (iMouseenter_TipIndex > 0)
                layer.close(iMouseenter_TipIndex);
            var spn = $(that);
            var sType = spn.attr("type");
            var stypeTitle = spn.attr("typeTitle");
            var sValue = spn.attr("value");
            var sHtml = ''; //'<div class="layui-card">';
            //sHtml = sHtml + '<div class="layui-card-header">' + stypeTitle + '</div>';
            //sHtml = sHtml + '<div class="layui-card-body">';



            var par = {
                area: ['240px', '160px']
            };
            //debugger;
            if (sType == "text") {

                sHtml = '<div class="auto-wrap"><h2>' + stypeTitle + '</h2>' + '<h3>' + sValue + '</h3></div>';
            } else {
                //测量一下文件尺寸
                const img = new Image();
                img.src = sValue;
                img.onload = function () {
                    //console.log("图片尺寸：" + img.width + '*' + img.height)

                    par = {
                        area: [(img.width / 2 + 30) + 'px', (img.height / 2 + 30) + 'px']
                    };
                    sHtml = '<img id="showPeopleImg" src="' + sValue +
                        '" width="' + img.width / 2 + '" height = "' + img.height / 2 + '"/>';

                    iMouseenter_TipIndex = layer.tips(sHtml, that, par);


                }
            }


            //sHtml = sHtml + '</div></div>';

            //console.log(sHtml);
            iMouseenter_TipIndex = layer.tips(sHtml, that, par);
        }

    });

    setTimeout(() => {
        setLanguage();
        setAllAttrVal()
    }, 100)
</script>
