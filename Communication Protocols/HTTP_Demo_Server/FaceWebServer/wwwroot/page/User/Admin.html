<div class="layuimini-container layuimini-page-anim" divname="admin">
    <div class="layuimini-main">

        <fieldset class="table-search-fieldset">
            <legend><span language="admin.a1">搜索信息</span> </legend>
            <div style="margin: 10px 10px 10px 10px">
                <form class="layui-form layui-form-pane" action="">
                    <div class="layui-form-item">
                        <div class="layui-inline">
                            <label class="layui-form-label"><span language="admin.a2">用户名</span></label>
                            <div class="layui-input-inline">
                                <input type="text" maxlength="30" name="UserName" autocomplete="off" class="layui-input">
                            </div>
                        </div>
                        <div class="layui-inline">
                            <label class="layui-form-label"><span language="admin.a3">手机号</span></label>
                            <div class="layui-input-inline">
                                <input type="text" maxlength="30" name="Phone" autocomplete="off" class="layui-input">
                            </div>
                        </div>
                        <div class="layui-inline">
                            <button type="submit" class="layui-btn layui-btn-primary" lay-submit lay-filter="data-search-btn"><i class="layui-icon"></i><span language="admin.a4"> 搜 索</span></button>
                        </div>
                    </div>
                </form>
            </div>
            
        </fieldset>

        <script type="text/html" id="toolbarDemo">
            <div class="layui-btn-container">
                <button class="layui-btn layui-btn-normal layui-btn-sm data-add-btn" lay-event="add"><span language="admin.a5">添加</span>  </button>
                <button class="layui-btn layui-btn-sm layui-btn-danger data-delete-btn" lay-event="delete"><span language="admin.a6">删除</span>  </button>
            </div>
        </script>

        <table class="layui-hide" id="AdminPageTable" lay-filter="AdminPageTableFilter"></table>

        <script type="text/html" id="currentTableBar">
            <a class="layui-btn layui-btn-normal layui-btn-xs data-count-edit" lay-event="edit"><span language="admin.a7">编辑</span></a>
            <a class="layui-btn layui-btn-xs layui-btn-danger data-count-delete" lay-event="delete"><span language="admin.a8">删除</span></a>
        </script>

    </div>
</div>

<script>
    layui.use(['form', 'table', 'miniPage', 'element', 'faceAPI'], function () {
        var $ = layui.jquery,
            form = layui.form,
            table = layui.table,
            miniPage = layui.miniPage;
        var faceAPI = layui.faceAPI;

        table.render({
            elem: '#AdminPageTable',
            //**************************异步请求开始***********************
            url: 'api/User/GetUserTable',
            method: 'post',
            contentType: "application/json",
            headers: {
                //token: 'sasasas',
                Authorization: "Bearer " + faceAPI.GetJWTToken()
            },//增加Token验证头
            request: {
                pageName: 'PageIndex', //页码的参数名称，默认：page
                limitName: 'PageSize' //每页数据量的参数名，默认：limit
            },
            parseData: function (res) { //res 即为原始返回的数据
                if (res.ErrCode == 0) {
                    var data = res.Content;
                    var ret = {
                        "code": res.ErrCode, //解析接口状态
                        "msg": res.Error, //解析提示文本
                        "count": data.TotalCount, //解析数据长度
                        "data": data.DataList //解析数据列表
                    };
                    return ret;

                } else{
                    /*layer.open({
                        title: '请求错误',
                        content: '(' + res.ErrCode + ')' + res.Error
                    });  */ 

                    return {
                        "code": 0, //解析接口状态
                        "msg": '', //解析提示文本
                        "count": 0, //解析数据长度
                        "data":[] //解析数据列表
                    };
                }
                
            },
            //**************************异步请求结束***********************

            toolbar: '#toolbarDemo',
            defaultToolbar: ['filter', 'exports', 'print', {
                title:  getLanguage('admin.a9'),
                layEvent: 'LAYTABLE_TIPS',
                icon: 'layui-icon-tips'
            }],
            cols: [[
                { type: "checkbox", width: 50 },
                //{ field: 'UserID', width: 80, title: 'ID', sort: true },
                { field: 'UserName', title: getLanguage('admin.a10'), sort: true },
                {
                    field: 'Role', title: getLanguage('admin.a11'), sort: true,
                    templet: function (d) {
                        var sBuf = [];
                        if (d.Role == 'Admin') {
                            // return '管理员';
                            return getLanguage('admin.a12')
                        }
                        if (d.Role == 'User') {
                            return getLanguage('admin.a13')
                        }
                        return d.Role;
                    }},
                { field: 'Phone', title: getLanguage('admin.a14'), sort: true },
                { field: 'OnlineTime', title: getLanguage('admin.a15','最后登录时间'), sort: true },
                { title: getLanguage('admin.a21','操作'), minWidth: 150, toolbar: '#currentTableBar', align: "center" }
            ]],
            limits: [10, 15, 20, 25, 50, 100],
            limit: 15,
            page: true,
            skin: 'line'
        });

        // 监听搜索操作
        form.on('submit(data-search-btn)', function (data) {
            var result = data.field;
            //执行搜索重载
            table.reload('AdminPageTable', {
                page: {
                    curr: 1
                }
                , where: result
            }, 'data');
            setLanguage();
            setAllAttrVal()
            return false;
        });

        /**
         * toolbar事件监听
         */
        table.on('toolbar(AdminPageTableFilter)', function (obj) {
            if (obj.event === 'add') {   // 监听添加操作
                var content = miniPage.getHrefContent('page/User/add.html');
                var openWH = miniPage.getOpenWidthHeight();
                faceAPI.AdminAddPageResult = null;
                var index = layer.open({
                    title: getLanguage('admin.a16','添加用户'),
                    type: 1,
                    shade: 0.2,
                    maxmin: false,
                    shadeClose: false,
                    area: [ '600px',  '420px'],
                    content: content,
                    end: function (layero, index) {
                        
                        var rst = faceAPI.AdminAddPageResult;
                        if (rst != null && rst.Result) {
                            //执行搜索重载
                            table.reload('AdminPageTable', {
                                page: {
                                    curr: 1
                                }
                            }, 'data');
                        };
                        
                    }
                });
                $(window).on("resize", function () {
                    layer.full(index);
                });
            }
            else if (obj.event === 'delete') {  // 监听删除操作
                var checkStatus = table.checkStatus('AdminPageTable')
                    , data = checkStatus.data;
                var userids = [];
                //console.log(data);
                data.forEach(function (item, index) {
                    if (item.UserID != 1) {
                        userids.push(item.UserID);
                    }
                });
                if (userids.length == 0) {
                    layer.alert(getLanguage('admin.a17','请勾选需要删除的用户ID'));
                    return;
                }
                layer.confirm(getLanguage('admin.a20') + '?', { icon: 3 }, function (
                    index) {
                    layer.close(index);

                    faceAPI.AjaxPOSTJson({
                        data: { userids },
                        url: '/api/User/Delete',
                        success: function (result) {
                            if (result.Result == false) {
                                layer.alert(result.Error, { icon: 2 });
                            }
                            else {
                                //刷新页面
                                table.reload('AdminPageTable', {
                                    page: {
                                        curr: 1
                                    }
                                }, 'data');
                            }

                        }
                    });

                });
            }
        });


        table.on('tool(AdminPageTableFilter)', function (obj) {
            var data = obj.data;

            if (obj.event === 'edit') {

                var content = miniPage.getHrefContent('page/User/edit.html');
                var openWH = miniPage.getOpenWidthHeight();
                faceAPI.AdminEditPage = data;//向layer页面传值，传值主要代码
                faceAPI.AdminEditPageResult=null;
                var index = layer.open({
                    title:getLanguage('admin.a18'),
                    type: 1,
                    shade: 0.2,
                    maxmin: false,
                    shadeClose: false,
                    area: ['600px',  '430px'],
                    content: content,
                    end: function (layero, index) {
                        var rst = faceAPI.AdminEditPageResult;
                        console.log(rst);
                        if (rst != null && rst.result) {
                            var newuser = rst.content;
                            //执行搜索重载
                            obj.update(newuser);
                        };

                    }
                });
                $(window).on("resize", function () {
                    layer.full(index);
                });
                return false;
            }
            else if (obj.event === 'delete') {
                if (data.UserID == 1) {
                    layer.open({ content: getLanguage('admin.a19') });
                    return;
                };

                layer.confirm(getLanguage('admin.a20')+'[' + data.UserName + ']?', function (index) {
                    var userids = [];
                    userids.push(data.UserID);
                    faceAPI.Ajax({
                        type: 'Post',
                        data: { userids },
                        url: '/api/User/Delete',
                        success: function (result) {
                            if (result.Result == false) {
                                layer.alert(result.Error, { icon: 2 });
                            }
                            else {
                                //刷新页面
                                obj.del();
                            }

                        }
                    });
                    
                   
                    layer.close(index);
                });
            }
        });
    });

    setTimeout(() => {
        setLanguage();
        setAllAttrVal()
    }, 100)

</script>
