<div class="layuimini-container layuimini-page-anim" divname="UserLog">
    <div class="layuimini-main">

        <script type="text/html" id="toolbarDemo">
            <div class="layui-btn-container">
                <button class="layui-btn layui-btn-normal layui-btn-sm data-add-btn" lay-event="search"> <i
                        class="layui-icon"></i> 
                    <span language='UserLog.u0'>查询</span> </button>

                <button class="layui-btn layui-btn-sm "  data-refresh="刷新" language='UserLog.u1'> 刷新 </button>
                <button class="layui-btn layui-btn-sm layui-btn-danger data-delete-btn" lay-event="clearLog" language='UserLog.u2'> 清空操作日志
                </button>
            </div>
        </script>

        <table class="layui-hide" id="UserLogPage" lay-filter="UserLogPageTableFilter"></table>

        <script type="text/html" id="currentTableBar">
            <a class="layui-btn layui-btn-normal layui-btn-xs data-count-edit" lay-event="edit" language='UserLog.u3'>详情</a>
        </script>
    </div>
</div>

<script>
        
    
    layui.use(['form', 'table', 'miniPage', 'element', 'faceAPI'], function () {
        var $ = layui.jquery,
            form = layui.form,
            table = layui.table,
            miniPage = layui.miniPage;
        var faceAPI = layui.faceAPI;
        form.render();

        IniSearchPar();

        table.render({
            elem: '#UserLogPage',
            //**************************异步请求开始***********************
            url: 'api/UserLog/GetLogs',
            method: 'post',
            contentType: "application/json",
            where: faceAPI.UserLogSearchPageResult.field,
            headers: {
                //token: 'sasasas',
                Authorization: "Bearer " + faceAPI.GetJWTToken()
            }, //增加Token验证头
            request: {
                pageName: 'PageIndex', //页码的参数名称，默认：page
                limitName: 'PageSize' //每页数据量的参数名，默认：limit
            },
            parseData: function (res) { //res 即为原始返回的数据
                if (res.ErrCode == 0) {
                    var data = res.Content;
                    var ret = {
                        "code": res.ErrCode, //解析接口状态
                        "msg": res.Error, //解析提示文本
                        "count": data.TotalCount, //解析数据长度
                        "data": data.DataList //解析数据列表
                    };
                    return ret;

                } else {
                    /*layer.open({
                        title: '请求错误',
                        content: '(' + res.ErrCode + ')' + res.Error
                    });  */

                    return {
                        "code": 0, //解析接口状态
                        "msg": '', //解析提示文本
                        "count": 0, //解析数据长度
                        "data": [] //解析数据列表
                    };
                }

            },
            //**************************异步请求结束***********************

            toolbar: '#toolbarDemo',
            defaultToolbar: ['filter', 'exports', 'print', {
                title: getLanguage('UserLog.u4'),
                layEvent: 'LAYTABLE_TIPS',
                icon: 'layui-icon-tips'
            }],
            cols: [
                [{
                        field: 'UserName',
                        width: 120,
                        title: getLanguage('UserLog.u5'),
                        sort: true
                    },
                    {
                        field: 'LogTime',
                        width: 200,
                        title: getLanguage('UserLog.u6'),
                        sort: true
                    },
                    {
                        field: 'LogType',
                        width: 120,
                        title: getLanguage('UserLog.u7'),
                        sort: true
                    },
                    {
                        field: 'LogDetail',
                        title: getLanguage('UserLog.u8'),
                        sort: true
                    },
                    {
                        title: getLanguage('UserLog.u9'),
                        width: 120,
                        toolbar: '#currentTableBar',
                        align: "center"
                    }
                ]
            ],
            limits: [50, 100, 200, 300, 400, 500],
            limit: 100,
            page: true,
            skin: 'line'
        });




        function IniSearchPar() {
            var par = {
                field: {
                    LogTimeBegin: dayjs().subtract(7, 'day').format("YYYY-MM-DD") + ' 00:00:00',
                    LogTimeEnd: dayjs().format("YYYY-MM-DD") + ' 23:59:59',
                },
                Result: true
            };

            faceAPI.UserLogSearchPageResult = par;
        }
        /**
         * toolbar事件监听
         */
        table.on('toolbar(UserLogPageTableFilter)', function (obj) {
            if (obj.event === 'search') { // 查询操作
                var content = miniPage.getHrefContent('page/User/search.html');
                var openWH = miniPage.getOpenWidthHeight();

                var index = layer.open({
                    title: getLanguage('UserLog.u10'),
                    type: 1,
                    shade: 0.2,
                    maxmin: true,
                    shadeClose: true,
                    area: ['800px', '500px'],
                    content: content,
                    end: function (layero, index) {
                        if (faceAPI.UserLogSearchPageResult.Result)
                            refreshTable(false);

                    }
                });
                $(window).on("resize", function () {
                    layer.full(index);
                });
            } else if (obj.event == 'refresh') {
                //执行搜索重载
                refreshTable(true);
            } else if (obj.event == 'clearLog') {
                layer.confirm(getLanguage('UserLog.u11'), { icon: 3 }, function (index) {
                    faceAPI.Ajax({
                        type: 'Delete',
                        url: '/api/UserLog/ClearLogs',
                        success: function (result) {
                            if (result.Result == false) {
                                layer.alert(result.Error, {
                                    icon: 2
                                });
                            } else {
                                refreshTable(true);
                            }

                        }

                    });
                    layer.close(index);
                });
            };
        });

        function refreshTable(bini) {
            if (bini) IniSearchPar();
            var rst = faceAPI.UserLogSearchPageResult;
            table.reload('UserLogPage', {
                page: {
                    curr: 1
                },
                where: rst.field
            }, 'data');
            setLanguage();
            setAllAttrVal()
        }


        table.on('tool(UserLogPageTableFilter)', function (obj) {
            var data = obj.data;

            if (obj.event === 'edit') {

                var content = miniPage.getHrefContent('page/User/Detail.html');
                var openWH = miniPage.getOpenWidthHeight();
                faceAPI.UserLogDetail = data; //向layer页面传值，传值主要代码
                var index = layer.open({
                    title: getLanguage('UserLog.u12'),
                    type: 1,
                    shade: 0.2,
                    maxmin: true,
                    shadeClose: true,
                    area: [ '700px',  '680px'],
                    content: content,
                });
                $(window).on("resize", function () {
                    layer.full(index);
                });
                return false;
            }
            
        });
        
        

    });

    //   window.onload=()=>{
        setTimeout(() => {
            setLanguage();
            setAllAttrVal() 
        }, 100);
    //   }   
</script>
