<div class="layuimini-main" id="admin-edit">

    <div class="layui-form layuimini-form" lay-filter="admin_edit_div_filter">
        <div class="layui-form-item">
            <label class="layui-form-label required">
                <span language="admin.a22">用户名</span>
            </label>
            <div class="layui-input-block">
                <input type="text" name="UserName" disabled id="admin.a23" data-lang='placeholder' placeholder="请输入用户名" value="" class="layui-input">
                <tip><span language="admin.a24">填写自己管理账号的名称。</span></tip>
            </div>
        </div>
        <div class="layui-form-item">
            <label class="layui-form-label required">
                <span language="admin.a25">身份</span>
            </label>
            <div class="layui-input-block">
                <div>
                    <input type="radio" id="adminType1" name="Role" value="Admin" id="admin.a26" data-lang='title'  checked="">
                    <span style="" language='admin.a26'> 管理员</span>
                </div>
                
                
                <input type="radio" id="adminType2" name="Role" value="User" id="admin.a27" data-lang='title' >
                <span language='admin.a27'> 操作员</span>
            </div>
        </div>
        <div class="layui-form-item">
            <label class="layui-form-label"><span language="admin.a28">登录密码</span></label>
            <div class="layui-input-block">
                <input type="password" autocomplete='off' name="UserPassword" id="admin.a29" data-lang='placeholder'  placeholder="请输入密码" class="layui-input">
            </div>
        </div>
        <div class="layui-form-item">
            <label class="layui-form-label required"><span language="admin.a30">手机</span></label>
            <div class="layui-input-block">
                <input type="number" name="Phone" lay-verify="required" id="admin.a31" data-lang='placeholder' placeholder="请输入手机" value="" class="layui-input">
            </div>
        </div>
        <div class="layui-form-item">
            <div class="layui-input-block">
                <button class="layui-btn layui-btn-normal" lay-submit lay-filter="saveBtn"><span language="admin.a32">确认保存</span></button>
            </div>
        </div>
    </div>
</div>
<script>
    layui.use(['form', 'table', 'faceAPI'], function () {
        var form = layui.form,
            layer = layui.layer,
            table = layui.table,
            $ = layui.$;
        var faceAPI = layui.faceAPI;
        faceAPI.AdminEditPageResult = null;
        var editdata = faceAPI.AdminEditPage;
        /*        $("#admin-edit [name=userName]").val(editdata.userName).attr("disabled", "disabled");*/

        form.val("admin_edit_div_filter", editdata);

        //$("#admin-edit [name=phone]").val(editdata.phone);
        //if (editdata.role == 'User')
        //    $("#admin-edit #adminType2").prop("checked", true);
        
        //$("#admin-edit [name=userName]").attr("userid", editdata.userID);


        /**
         * 初始化表单，要加上，不然刷新部分组件可能会不加载
         */
        form.render();

        // 当前弹出层，防止ID被覆盖
        var parentIndex = layer.index;

        //监听提交
        form.on('submit(saveBtn)', function (data) {
            var postData = data.field;
            delete postData.UserName;
            postData.UserID = editdata.UserID;
            faceAPI.AjaxPOSTJson({
                type: 'Post',
                data: postData,
                url: '/api/User/Update',
                success: function (result) {
                    if (result.Result == false) {
                        layer.alert(result.Error, { icon: 2 });
                    }
                    else {
                        result.Content = postData;
                        faceAPI.AdminEditPageResult = result;
                        layer.close(parentIndex);
                    }

                }
            });



            return false;
        });

    });

    setTimeout(() => {
        setLanguage();
        setAllAttrVal()
    }, 300)
</script>
