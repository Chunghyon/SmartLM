<div class="layuimini-container layuimini-page-anim" divname="deviceAccess">
    <style>
        .auto-wrap {
            word-wrap: break-word; /* 或者使用 overflow-wrap: break-word; */
            white-space: normal;
            word-break: break-all;
        }
    </style>
    <div class="layuimini-main">



        <script type="text/html" id="toolbarDemo">
            <div class="layui-btn-container">

                <button class="layui-btn layui-btn-normal layui-btn-sm data-add-btn" lay-event="add">
                    <i class="layui-icon layui-icon-key"></i>
                    <span language='access.a1' tt="授权"></span>
                </button>

                <button class="layui-btn layui-btn-normal layui-btn-sm data-add-btn" lay-event="search">
                    <i class="layui-icon"></i>
                    <span language='access.a2' tt="查询"></span>
                </button>

                <button class="layui-btn layui-btn-sm" lay-event="refresh">
                    <i class="layui-icon"></i>
                    <span language='access.a3' tt="刷新"></span>
                </button>

                <button class="layui-btn layui-btn-sm" lay-event="reUpload">
                    <span language='access.a4' tt="重新上传勾选项"></span>
                </button>

                <button class="layui-btn layui-btn-sm" lay-event="reUploadAll">
                    <span language='access.a5' tt="全部重新上传"></span>
                </button>

                <button class="layui-btn layui-btn-sm" lay-event="reUploadFilterAll">
                    <span language='access.reUploadFilterAll' tt="重新上传筛选内容"></span>
                </button>

                <button class="layui-btn layui-btn-sm layui-btn-danger data-delete-btn" lay-event="delete">

                    <span language='access.a6' tt="删除"></span>
                </button>
                <button class="layui-btn layui-btn-sm layui-btn-danger data-delete-btn" lay-event="clear">
                    <span language='access.a7' tt="清空所有"></span>
                </button>
            </div>
        </script>

        <table class="layui-hide" id="deviceAccessPageTable" lay-filter="currentTableFilter"></table>

        <script type="text/html" id="currentTableBar">
            <a class="layui-btn layui-btn-normal layui-btn-xs data-count-edit" lay-event="edit" language='access.a8' tt="编辑"></a>
            <a class="layui-btn layui-btn-xs layui-btn-danger data-count-delete" lay-event="delete" language='access.a9' tt="删除"></a>
        </script>

    </div>
</div>
<style>
    .label_upload {
        color: #0034FF;
    }

    .label_wait {
        color: #8C7F12;
    }

    .label_delete {
        color: #DC143C;
    }

    .label_error {
        color: #FF5722;
        font-weight: bold;
    }
</style>

<script>

    layui.use(['form', 'table', 'miniPage', 'element', 'faceAPI'], function () {
        var $ = layui.jquery,
            form = layui.form,
            table = layui.table,
            miniPage = layui.miniPage;
        var faceAPI = layui.faceAPI;


        var UploadStatusTable = [];
        UploadStatusTable[0] = `<span class="label label_wait">${getLanguage('access.a10')}</span>`;//未上传
        UploadStatusTable[1] = `<span class="label label_upload">${getLanguage('access.a11')}</span>`;//已上传
        UploadStatusTable[2] = `<span class="label label_delete">${getLanguage('access.a12')}</span>`;//待删除

        var UploadResultTable = [];
        //HTTPv1 协议错误代码
        UploadResultTable[100] = getLanguage('access.UploadResult_0');//导入成功
        UploadResultTable[101] = getLanguage('access.UploadResult_1');//人脸被拒绝
        UploadResultTable[102] = getLanguage('access.UploadResult_2');//未包含卡号或照片
        UploadResultTable[103] = getLanguage('access.UploadResult_3');//未检测到脸部
        UploadResultTable[104] = getLanguage('access.UploadResult_4');//人脸特征值提取失败
        UploadResultTable[105] = getLanguage('access.UploadResult_5');//照片包含多个人
        UploadResultTable[106] = getLanguage('access.UploadResult_6');//图像尺寸不符合要求
        UploadResultTable[107] = getLanguage('access.UploadResult_7');//图像解码失败
        UploadResultTable[108] = getLanguage('access.UploadResult_8');//图像拷贝出错
        UploadResultTable[109] = getLanguage('access.UploadResult_9');//没有照片
        UploadResultTable[110] = getLanguage('access.UploadResult_10');//人员信息写入数据库失败
        UploadResultTable[111] = getLanguage('access.UploadResult_11');//图像画质过低
        UploadResultTable[112] = getLanguage('access.UploadResult_12');//人脸相似度太高
        UploadResultTable[113] = getLanguage('access.UploadResult_13');//超过一个注册限制
        UploadResultTable[114] = getLanguage('access.UploadResult_14');//图像格式不符合要求
        UploadResultTable[115] = getLanguage('access.UploadResult_15');//应用程序内部错误
        UploadResultTable[116] = getLanguage('access.UploadResult_16');//重复注册错误
        UploadResultTable[117] = getLanguage('access.UploadResult_17');//人脸被认为是别人
        UploadResultTable[118] = getLanguage('access.UploadResult_18');//人脸注册校验成功
        UploadResultTable[119] = getLanguage('access.UploadResult_19');//人脸注册校验失败
        UploadResultTable[120] = getLanguage('access.UploadResult_20');//Json 数据解析出错
        UploadResultTable[121] = getLanguage('access.UploadResult_21');//管理员数量超出最大容量
        UploadResultTable[122] = getLanguage('access.UploadResult_22');//人员照片下载错误
        UploadResultTable[123] = getLanguage('access.UploadResult_23');//卡片重复
        UploadResultTable[124] = getLanguage('access.UploadResult_24');//设备用户已存满
        UploadResultTable[125] = getLanguage('access.UploadResult_25');//参数检测错误

        //HTTPv2 协议错误代码
        UploadResultTable[1001] = getLanguage('access.UploadResult_HTTPv2_1');//人员信息参数异常
        UploadResultTable[1002] = getLanguage('access.UploadResult_HTTPv2_2');//人员照片URL下载失败
        UploadResultTable[1003] = getLanguage('access.UploadResult_HTTPv2_3');//人员照片图像太大不符合要求,需要小于500kb
        UploadResultTable[1004] = getLanguage('access.UploadResult_HTTPv2_4');//人脸特征码下载失败
        UploadResultTable[1005] = getLanguage('access.UploadResult_HTTPv2_5');//指纹特征码下载失败
        UploadResultTable[1006] = getLanguage('access.UploadResult_HTTPv2_6');//掌静脉特征码下载失败

        UploadResultTable[1020] = getLanguage('access.UploadResult_HTTPv2_20');//人脸特征码重复
        UploadResultTable[1021] = getLanguage('access.UploadResult_HTTPv2_21');//指纹特征码重复
        UploadResultTable[1022] = getLanguage('access.UploadResult_HTTPv2_22');//掌静脉特征码重复
        UploadResultTable[1023] = getLanguage('access.UploadResult_HTTPv2_23');//卡号重复
        UploadResultTable[1024] = getLanguage('access.UploadResult_HTTPv2_24');//人员已存满
        UploadResultTable[1025] = getLanguage('access.UploadResult_HTTPv2_25');//查询数据时发生错误
        UploadResultTable[1026] = getLanguage('access.UploadResult_HTTPv2_26');//保存人员照片时发生错误
        UploadResultTable[1027] = getLanguage('access.UploadResult_HTTPv2_27');//人脸特征码格式错误
        UploadResultTable[1028] = getLanguage('access.UploadResult_HTTPv2_28');//指纹特征码格式错误
        UploadResultTable[1029] = getLanguage('access.UploadResult_HTTPv2_29');//掌静脉特征码格式错误
        UploadResultTable[1030] = getLanguage('access.UploadResult_HTTPv2_30');//照片不可识别
        UploadResultTable[1031] = getLanguage('access.UploadResult_HTTPv2_31');//保存指纹特征码时发生错误
        UploadResultTable[1032] = getLanguage('access.UploadResult_HTTPv2_32');//保存掌静脉特征码时发生错误


        //人员角色 0,普通人员；1，管理员;2 黑名单
        var AccessTypeMap = [];
        AccessTypeMap[0] = getLanguage('access.a41');//0,普通人员
        AccessTypeMap[1] = getLanguage('access.a42');//1，管理员
        AccessTypeMap[2] = getLanguage('access.a43');//2 黑名单

        IniSearchPar();

        faceAPI.UploadResultTable = UploadResultTable;
        faceAPI.UploadStatusTable = UploadStatusTable;


        table.render({
            elem: '#deviceAccessPageTable',
            //**************************异步请求开始***********************
            url: 'api/DeviceAccess/Query',
            method: 'post',
            contentType: "application/json",
            headers: {
                Authorization: "Bearer " + faceAPI.GetJWTToken()
            },//增加Token验证头
            request: {
                pageName: 'PageIndex', //页码的参数名称，默认：page
                limitName: 'PageSize' //每页数据量的参数名，默认：limit
            },
            parseData: function (res) { //res 即为原始返回的数据
                if (res.ErrCode == 0) {
                    var data = res.Content;
                    var ret = {
                        "code": res.ErrCode, //解析接口状态
                        "msg": res.Error, //解析提示文本
                        "count": data.TotalCount, //解析数据长度
                        "data": data.DataList //解析数据列表
                    };
                    return ret;

                } else {
                    /*layer.open({
                        title: '请求错误',
                        content: '(' + res.ErrCode + ')' + res.Error
                    });  */

                    return {
                        "code": 0, //解析接口状态
                        "msg": '', //解析提示文本
                        "count": 0, //解析数据长度
                        "data": [] //解析数据列表
                    };
                }

            },
            //**************************异步请求结束***********************

            toolbar: '#toolbarDemo',
            defaultToolbar: ['filter', 'exports', 'print', {
                title: getLanguage('access.a35'),
                layEvent: 'LAYTABLE_TIPS',
                icon: 'layui-icon-tips'
            }],
            cols: [[
                { type: "checkbox", width: 50 },
                { field: 'SN', width: 160, title: 'SN', sort: true },
                { field: 'Protocol', width: 160, title: getLanguage('device.Protocol'), sort: true },//协议类型
                { field: 'DeviceName', width: 160, title: getLanguage('access.a36'), sort: true },
                { field: 'UserID', width: 130, title: getLanguage('access.a37'), sort: true },
                { field: 'Name', width: 200, title: getLanguage('access.a38'), sort: true },
                {
                    field: 'access', width: 300, title: getLanguage('access.a39'), sort: false,
                    templet: function (d) {
                        var sBuf = [];
                        if (d.PhotoLen > 0) {
                            sBuf.push(
                                `<i class="PeopleAccessKey" typeTitle="${getLanguage('people.p14')}" type="image" value = "` + d.Photo + '"><svg t="1690358148845" class="icon" viewBox="0 0 1024 1024" version="1.1" xmlns="http://www.w3.org/2000/svg" p-id="3418" width="20" height="20"><path d="M725.333333 721.066667l-38.4-38.4H379.733333l-38.4 38.4V768h384v-46.933333z m85.333334-38.4v170.666666H256v-170.666666h4.266667l85.333333-85.333334h375.466667l89.6 85.333334z m-85.333334-320c0 106.666667-85.333333 192-192 192S341.333333 469.333333 341.333333 362.666667 426.666667 170.666667 533.333333 170.666667 725.333333 256 725.333333 362.666667z m-85.333333 0C640 302.933333 593.066667 256 533.333333 256S426.666667 302.933333 426.666667 362.666667s46.933333 106.666667 106.666666 106.666666S640 422.4 640 362.666667z" fill="#444444" p-id="3419"></path></svg></i>'
                            );
                        }

                        if (d.hasOwnProperty("Password") == true)
                            if (d.Password.length > 0) {
                                sBuf.push(
                                    `<i class="PeopleAccessKey" typeTitle="${getLanguage('people.p15')}" type="text" value = "` + d.Password + '"><svg t="1690358607999" class="icon" viewBox="0 0 1024 1024" version="1.1" xmlns="http://www.w3.org/2000/svg" p-id="4410" width="20" height="20"><path d="M204.8 390.4A19.2 19.2 0 0 0 185.6 409.6v409.6c0 10.5984 8.6016 19.2 19.2 19.2h614.4a19.2 19.2 0 0 0 19.2-19.2V409.6A19.2 19.2 0 0 0 819.2 390.4H204.8z m96-64V204.8c0-45.9264 37.2736-83.2 83.2-83.2h256c45.9264 0 83.2 37.2736 83.2 83.2v121.6H819.2c45.9264 0 83.2 37.2736 83.2 83.2v409.6c0 45.9264-37.2736 83.2-83.2 83.2H204.8A83.2 83.2 0 0 1 121.6 819.2V409.6c0-45.9264 37.2736-83.2 83.2-83.2h96z m64 0h294.4V204.8a19.2 19.2 0 0 0-19.2-19.2h-256A19.2 19.2 0 0 0 364.8 204.8v121.6z" fill="#5A5A68" p-id="4411"></path><path d="M358.4 646.4a32 32 0 1 1 0-64h307.2a32 32 0 1 1 0 64H358.4z" fill="#5A5A68" p-id="4412"></path></svg></i>'

                        if (d.FaceNum > 0) {
                            sBuf.push(
                                `<i class="PeopleAccessKey" typeTitle="${getLanguage('people.face')}" type="text" value = "` + d.FaceNum + '"><svg t="1719386358833" class="icon" viewBox="0 0 1024 1024" version="1.1" xmlns="http://www.w3.org/2000/svg" p-id="6776" width="20" height="20"><path d="M898.7648 397.7728c-16.9472 0-30.72-13.7728-30.72-30.72V197.376c0-26.9824-21.9648-48.9984-48.9984-48.9984h-170.9568c-16.9472 0-30.72-13.7728-30.72-30.72s13.7728-30.72 30.72-30.72h170.9568c60.8768 0 110.4384 49.5104 110.4384 110.4384v169.6768c0 16.9984-13.7728 30.72-30.72 30.72zM818.432 923.1872h-169.6768c-16.9472 0-30.72-13.7728-30.72-30.72s13.7728-30.72 30.72-30.72h169.6768c26.9824 0 48.9984-21.9648 48.9984-48.9984v-170.9568c0-16.9472 13.7728-30.72 30.72-30.72s30.72 13.7728 30.72 30.72v170.9568c-0.0512 60.928-49.5616 110.4384-110.4384 110.4384zM128.0512 397.7728c-16.9472 0-30.72-13.7728-30.72-30.72V197.376c0-60.8768 49.5104-110.4384 110.4384-110.4384h170.9568c16.9472 0 30.72 13.7728 30.72 30.72s-13.7728 30.72-30.72 30.72h-171.008c-26.9824 0-48.9984 21.9648-48.9984 48.9984v169.6768c0.0512 16.9984-13.7216 30.72-30.6688 30.72zM378.0608 923.1872H208.384c-60.8768 0-110.4384-49.5104-110.4384-110.4384v-170.9568c0-16.9472 13.7728-30.72 30.72-30.72s30.72 13.7728 30.72 30.72v170.9568c0 27.0336 21.9648 48.9984 48.9984 48.9984h169.6768c16.9472 0 30.72 13.7728 30.72 30.72s-13.7728 30.72-30.72 30.72z" fill="#474747" p-id="6777"></path><path d="M527.8208 565.4016c-94.7712 0-171.9296-77.1072-171.9296-171.9296 0-94.7712 77.1072-171.8784 171.9296-171.8784 94.7712 0 171.8784 77.1072 171.8784 171.8784 0 94.7712-77.1072 171.9296-171.8784 171.9296z m0-282.368c-60.928 0-110.4896 49.5616-110.4896 110.4384s49.5616 110.4896 110.4896 110.4896 110.4384-49.5616 110.4384-110.4896-49.5104-110.4384-110.4384-110.4384z" fill="#336BFF" p-id="6778"></path><path d="M751.6672 793.4976c-16.9472 0-30.72-13.7728-30.72-30.72 0-106.496-86.6304-193.1264-193.1264-193.1264s-193.1776 86.6304-193.1776 193.1264c0 16.9472-13                             );
                        }

                        if (d.FingerprintsNum > 0) {

                {
                    //人员角色 0,普通人员；1，管理员;2 黑名单
                    field: 'AccessType', width: 130, title: getLanguage('access.a40'), sort: false,
                    templet: function (d) {
                        return AccessTypeMap[d.AccessType];
                    }
                },
                {//开门时段
                    field: 'Timegroup', width: 160, title: getLanguage('access.a45'), sort: false,
                    templet: function (d) {
                        return getLanguage('access.a94') + d.Timegroup; //时段 x
                    }
                },
                {//开门次数
                    field: 'OpenTimes', width: 140, title: getLanguage('access.a47'), sort: false,
                    templet: function (d) {
                        if (d.OpenTimes == 65535) return getLanguage('access.a95');//无限制
                        if (d.OpenTimes == 0) return getLanguage('access.a197');//已用尽
                        return d.OpenTimes + getLanguage('access.a49');//x 次
                    }
                },
                {//截止日期
                    field: 'ExpirationDate',
                    width: 160,
                    title: getLanguage('access.a50'),
                    sort: false
                },
                {//上传状态
                    field: 'UploadStatus', width: 140, title: getLanguage('access.a51'), sort: false,
                    templet: function (d) {
                        var sBuf = [];
                        if (d.UploadStatus >= 0 && d.UploadStatus <= 2) {
                            if (d.UploadStatus == 1) {
                                if (d.UploadResult > 1) {
                                    if (d.hasOwnProperty("UploadResultMsg") == false)
                                        d.UploadResultMsg = "";

                                    //上传完毕，但是有错误
                                    var sTip = '<div class="label_error showtoolTip" isError = "1"  UploadTime="' + d.UploadTime +
                                        '" UploadResult="' + d.UploadResult +
                                        '" RepeatID="' + d.RepeatID +
                                        '" UploadResultMsg="' + d.UploadResultMsg +
                                        '"><i class="fa fa-exclamation-triangle "></i>' +
                                        UploadResultTable[d.UploadResult] + '</div>';
                                    return sTip;
                                } else {
                                    //成功上传
                                    var sTip = '<span class="label label_upload showtoolTip"  isError = "0" UploadTime="' + d.UploadTime + `" >${getLanguage('access.a52')}</span>`;
                                    return sTip;
                                }

                            } else {
                                return UploadStatusTable[d.UploadStatus];
                            }


                        }
                        return getLanguage('access.a53') + d.UploadStatus;//错误 x
                    }
                },
                {//操作
                    title: getLanguage('access.a54'), width: 130, toolbar: '#currentTableBar'
                }
            ]],
            limits: [100, 200, 300, 400, 500, 600],
            limit: 100,
            page: true,
            skin: 'line',
            done: function (res, curr, count) {
                //绑定事件
                if (res.count > 0) {
                    bindPeopleAccessKey();
                }
                setLanguage();
                setAllAttrVal()
            }
        });

        function bindPeopleAccessKey() {
            $("[lay-id=deviceAccessPageTable] i.PeopleAccessKey").mouseenter(AccessKey_mouseenter);
            $("[lay-id=deviceAccessPageTable] i.PeopleAccessKey").mouseleave(() => {
                if (iMouseenter_TipIndex > 0)
                    layer.close(iMouseenter_TipIndex);
            });
            $(".showtoolTip").mouseenter(uploadTime_mouseenter);
            $(".showtoolTip").mouseleave(() => {
                if (iMouseenter_TipIndex > 0)
                    layer.close(iMouseenter_TipIndex);
            });
        }
        table.on('sort(deviceAccessPageTableFilter)', function (obj) {
            bindPeopleAccessKey();

        });

        // 人员凭证显示提示框
        var iMouseenter_TipIndex = 0;
        function AccessKey_mouseenter() {
            var that = this;
            if (iMouseenter_TipIndex > 0)
                layer.close(iMouseenter_TipIndex);
            var spn = $(that);
            var sType = spn.attr("type");
            var stypeTitle = spn.attr("typeTitle");
            var sValue = spn.attr("value");
            var sHtml = '';//'<div class="layui-card">';
            //sHtml = sHtml + '<div class="layui-card-header">' + stypeTitle + '</div>';
            //sHtml = sHtml + '<div class="layui-card-body">';



            var par = { area: ['240px', '160px'] };
            //debugger;
            if (sType == "text") {

                sHtml = '<div class="auto-wrap"><h2>' + stypeTitle + '</h2>' + '<h3>' + sValue + '</h3></div>';
            }
            else {
                //测量一下文件尺寸
                const img = new Image();
                img.src = sValue;
                img.onload = function () {
                    //console.log("图片尺寸：" + img.width + '*' + img.height)

                    par = {
                        area: [(img.width / 2 + 30) + 'px', (img.height / 2 + 30) + 'px']
                    };
                    sHtml = '<img id="showPeopleImg" src="' + sValue +
                        '" width="' + img.width / 2 + '" height = "' + img.height / 2 + '"/>';

                    iMouseenter_TipIndex = layer.tips(sHtml, that, par);
                }

               
            }


            //sHtml = sHtml + '</div></div>';

            //console.log(sHtml);
            iMouseenter_TipIndex = layer.tips(sHtml, that, par);
        }

        function uploadTime_mouseenter() {
            var that = this;
            if (iMouseenter_TipIndex > 0)
                layer.close(iMouseenter_TipIndex);
            var spn = $(that);
            var sUploadtime = spn.attr("Uploadtime");
            var sIsError = spn.attr("isError");

            var sUploadResult = spn.attr("UploadResult");
            var sRepeatID = spn.attr("RepeatID");
            var sUploadResultMsg = spn.attr("UploadResultMsg");

            var sHtml = '';//'<div class="layui-card">';


            var par = { area: ['400px', '150px'] };
            //debugger;

            sHtml = `<h2>${getLanguage('access.a55')} : ` + sUploadtime + '</h2>';
            if (sIsError == "1") {
                var iUploadResult = Number(sUploadResult);

                sUploadResult = '<span class="label_error" ><i class="fa fa-exclamation-triangle "></i>' +
                    UploadResultTable[iUploadResult] + '</span>';

                //错误信息
                sHtml += `<h3>${getLanguage('access.UploadResult')} : ` + sUploadResult + '</h3>';

                if (sRepeatID.length > 0) {
                    sHtml += `<h3>${getLanguage('access.RepeatIDTip')} : <span class="label_error" >` + sRepeatID + '</span></h3>';

                }
                if (sUploadResultMsg.length > 0) {
                    sHtml += `<h3>${getLanguage('access.UploadResultMsg')} :  <span class="label_error" >` + sUploadResultMsg + '</span></h3>';

                }
            }

            iMouseenter_TipIndex = layer.tips(sHtml, that, par);
        }

        /**
         * toolbar事件监听
         */
        table.on('toolbar(currentTableFilter)', function (obj) {
            if (obj.event === 'add') {   // 监听添加操作
                var content = miniPage.getHrefContent('page/Access/Add.html');
                var openWH = miniPage.getOpenWidthHeight();
                faceAPI.AccessAddPageResult = null;
                var index = layer.open({
                    title: getLanguage('access.a56'),//权限授权
                    type: 1,
                    shade: 0.2,
                    maxmin: false,
                    shadeClose: false,
                    area: ['950px', '850px'],
                    content: content,
                    end: function (layero, index) {
                        var rst = faceAPI.AccessAddPageResult;
                        if (rst != null && rst.Result) {
                            //执行搜索重载
                            refreshTable(true);
                        };

                    }
                });
            }
            else if (obj.event === 'search') {  // 监听删除操作
                var content = miniPage.getHrefContent('page/Access/Search.html');
                var openWH = miniPage.getOpenWidthHeight();

                var index = layer.open({
                    title: getLanguage('access.a57'),//查询权限
                    type: 1,
                    shade: 0.2,
                    maxmin: false,
                    shadeClose: false,
                    area: ['1100px', '550px'],
                    content: content,
                    end: function (layero, index) {
                        var rst = faceAPI.AccessSearchPageResult;
                        if (rst != null && rst.Result) {
                            refreshTable(false);
                        };
                    }
                });
            }
            else if (obj.event === 'delete') {  // 监听删除操作
                var checkStatus = table.checkStatus('deviceAccessPageTable')
                    , data = checkStatus.data;
                var accessIDs = [];
                data.forEach(function (item, index) { accessIDs.push(item.AccessID); });
                if (accessIDs.length == 0) {
                    layer.alert(getLanguage('access.a58'), { icon: 2 });//请勾选需要删除的权限
                    return;
                }
                //操作确认： 是否删除勾选的权限？
                layer.confirm(getLanguage('access.DeleteAccessTip'), { icon: 3 }, function (
                    index) {
                    deleteAccess(accessIDs);

                    layer.close(index);
                });
            }
            else if (obj.event === 'refresh') {  // 监听删除操作
                refreshTable(true);
            }
            else if (obj.event === 'clear') {  // 监听删除操作
                layer.confirm(getLanguage('access.a59'), { icon: 3 }, function (index) {
                    faceAPI.AjaxPOSTJson({
                        url: '/api/DeviceAccess/ClearAccess',
                        success: function (result) {
                            if (result.Result == false) {
                                layer.alert(result.Error, { icon: 2 });
                            }
                            else {
                                //刷新页面
                                refreshTable(true);
                            }

                        }
                    });
                    layer.close(index);
                });
            }
            else if (obj.event === 'reUpload') {
                btnReupload();
            }
            else if (obj.event === 'reUploadAll') {
                btnReuploadAll();
            }
            else if (obj.event === 'reUploadFilterAll') {
                btnUploadFilterAll();
            } ;
        });

        function deleteAccess(accessIDs, itemObj) {

            faceAPI.AjaxPOSTJson({
                data: {
                    AccessIDs: accessIDs
                },
                url: '/api/DeviceAccess/Delete',
                success: function (result) {
                    if (result.Result == false) {
                        layer.alert(result.Error, { icon: 2 });
                    } else {

                        //刷新页面
                        if (itemObj != undefined)
                            itemObj.del();
                        else
                            refreshTable(false);
                    }

                }
            });

        }

        function btnReupload() {//勾选项重新上传
            var checkStatus = table.checkStatus('deviceAccessPageTable')
                , data = checkStatus.data;
            var accessIDs = [];
            data.forEach(function (item, index) { accessIDs.push(item.AccessID); });
            if (accessIDs.length == 0) {
                layer.alert(getLanguage('access.a60'), { icon: 2 });//请勾选需要重新上传的权限
                return;
            }
            //操作确认：将勾选的权限重新上传？
            layer.confirm(getLanguage('access.a61'), { icon: 3 }, function (index) {
                faceAPI.AjaxPOSTJson({
                    data: { AccessIDs: accessIDs },
                    url: '/api/DeviceAccess/Reupload',
                    success: function (result) {
                        if (result.Result == false) {
                            layer.alert(result.Error, { icon: 2 });
                        }
                        else {
                            //刷新页面
                            refreshTable(true);
                        }

                    }
                });
                layer.close(index);
            });
        }

        function btnReuploadAll() {//所有权限重新上传
            layer.confirm(getLanguage('access.a62'), { icon: 3 }, function (index) {
                faceAPI.AjaxPOSTJson({
                    url: '/api/DeviceAccess/ReuploadAll',
                    success: function (result) {
                        if (result.Result == false) {
                            layer.alert(result.Error, { icon: 2 });
                        }
                        else {
                            //刷新页面
                            refreshTable(true);
                        }

                    }
                });
                layer.close(index);
            });
        }
        function btnUploadFilterAll() {//查询出的权限重新上传

            var rst = faceAPI.AccessSearchPageResult;
            var par = rst.field;
            layer.confirm(getLanguage('access.ReuploadFilterAllMsg'), { icon: 3 }, function (index) {
                faceAPI.AjaxPOSTJson({
                    data: par,
                    url: '/api/DeviceAccess/ReuploadFilterAll',
                    success: function (result) {
                        if (result.Result == false) {
                            layer.alert(result.Error, { icon: 2 });
                        }
                        else {
                            //刷新页面
                            refreshTable(true);
                        }

                    }
                });
                layer.close(index);
            });
        }
        

        function refreshTable(bIni) {
            if (bIni) IniSearchPar();
            var rst = faceAPI.AccessSearchPageResult;
            table.reload('deviceAccessPageTable', {
                page: {
                    curr: 1
                }, where: rst.field
            }, 'data');
            setLanguage();
            setAllAttrVal()
        }

        function IniSearchPar() {
            var par = {
                field: {
                    AccessID: null,
                    SN: null,
                    Protocol: null,
                    DeviceName: null,
                    UserID: null,
                    Name: null,
                    Photo: null,
                    Password: null,
                    CardNum: null,
                    QRCode: null,
                    Face: null,
                    Palmveins: null,
                    Fingerprints: null,
                    AccessType: null,
                    UploadStatus: null,
                    UploadResult: null,
                },
                Result: true
            };

            faceAPI.AccessSearchPageResult = par;
        }
        IniSearchPar();


        table.on('tool(currentTableFilter)', function (obj) {
            var data = obj.data;

            if (obj.event === 'edit') {

                var content = miniPage.getHrefContent('page/Access/Edit.html');
                var openWH = miniPage.getOpenWidthHeight();
                faceAPI.AccessEditPage = data;//向layer页面传值，传值主要代码
                faceAPI.AccessEditPageResult = null;
                var index = layer.open({
                    title: getLanguage('access.a63'),//编辑人员权限
                    type: 1,
                    shade: 0.2,
                    maxmin: false,
                    shadeClose: false,
                    area: ['1050px', '800px'],
                    content: content,
                    end: function (layero, index) {

                        var rst = faceAPI.AccessEditPageResult;
                        if (rst != null && rst.Result) {
                            var newAccess = rst.Content;
                            //执行更新
                            IniSearchPar();
                            faceAPI.AccessSearchPageResult.field.AccessID = newAccess.AccessID;
                            refreshTable(false);
                        };

                    }
                });
                return false;
            }
            else if (obj.event === 'delete') {

                layer.confirm(getLanguage('access.a64') + data.Name +
                    '(' + data.UserID + getLanguage('access.a65') +
                    data.DeviceName + getLanguage('access.a66'),
                    { icon: 3 },
                    function (index) {

                        var accessIDs = [];
                        accessIDs.push(data.AccessID);
                        deleteAccess(accessIDs, obj);

                        layer.close(index);
                    });
            }
        });
    });


    setTimeout(() => {
        setLanguage();
        setAllAttrVal()
    }, 100);
</script>
