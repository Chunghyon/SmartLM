<script>
    setLanguage();
    setAllAttrVal();


    layui.use(
        ["form", "upload", "table", "miniPage", "faceAPI", "slider", "laydate"],
        function () {
            // debugger
            var $ = layui.jquery;
            var form = layui.form,
                layer = layui.layer,
                miniPage = layui.miniPage,
                table = layui.table;
            var faceAPI = layui.faceAPI;
            var laydate = layui.laydate;
            var TimeGroups = [];
            var parentIndex = layer.index;

            var peopleDetail = {};
            faceAPI.AccessEditPageResult = {};
            /**
             * 初始化表单，要加上，不然刷新部分组件可能会不加载
             */
            form.render();

            var formDataobj = {};

            var peopleEdit = {
                setParentIndex(index) {
                    parentIndex = index;
                },

                /**
                 * 创建时段下拉框
                 * @param {any} name
                 */
                createTimeGroup: function (name) {
                    for (var i = 1; i < 65; i++) {
                        var sItem = ' <option value="' + i + '" ';
                        if (i == 1) sItem += " selected";
                        sItem += `> ${getLanguage("access.a94")}` + i + "</option> ";
                        TimeGroups.push(sItem);
                    }
                    $("[name=" + name + "]").html(TimeGroups.join(""));

                    form.render("select");
                },

                /**
                 * 创建时间控件
                 * @param {any} name
                 */
                createLaydate(name, value) {
                    laydate.render({
                        elem: '[name="' + name + '"]', //指定元素
                        type: "datetime",
                        format: 'yyyy-MM-dd HH:mm:ss',
                        min: '2024-01-01',
                        max: '2099-12-31 23:59:59',
                        fullPanel: true

                    });
                    $('[name="' + name + '"]').attr("value", value);
                },
                /**
                 * 创建表格
                 * @param {*} elem  tableid
                 * @param {*} title  标题
                 * @param {*} data  数据
                 */
                CreateTable(elem, title, data) {
                    table.render({
                        elem: "#" + elem,
                        cols: [
                            [
                                //标题栏
                                { type: "checkbox", width: 60 },
                                { field: "num", title: title, width: 935 },
                            ],
                        ],
                        data: data,
                        height: 430,
                        limit: 1000, // 每页默认显示的数量
                    });
                    return table;
                },
                /**
                 * 创建表格数据
                 * @param {*} len
                 * @param {*} checked
                 * @returns
                 */
                CreateTableData: function (len, checked) {
                    if (checked == undefined) checked = [];
                    var data = [];
                    for (var i = 1; i <= len; i++)
                        data.push({
                            LAY_CHECKED: checked.includes(i.toString()),
                            num: i,
                        });
                    return data;
                },
                /**
                 *
                 * 根据权限ID获取权限详情
                 */
                GetUserDetail: function () {
                    var that = this;
                    var loadIndex = layer.load(1, { shade: [0.6, "#e2e2e2"] }); //0.1透明度的白色背景

                    var sURL = "/api/DeviceAccess/GetAccessDetail/" + faceAPI.AccessEditPage.AccessID;
                    faceAPI.AjaxPOSTJson({
                        url: sURL,
                        success: function (result) {
                            layer.close(loadIndex);

                            that.formBind(result);
                        },
                    });
                },
                /**
                 *
                 * 设置表单对象
                 * @param {any} result
                 */
                formBind: function (result) {
                    if (result.Result == false) {
                        layer.alert(result.Error, { icon: 2 });
                        layer.close(parentIndex);
                        return;
                    }

                    peopleDetail = result.Content.Access;
                    delete result.Content.Access;

                    peopleDetail = $.extend({}, peopleDetail, result.Content);


                    if (peopleDetail.UploadStatus == 0) {
                        peopleDetail.UploadResult = "";
                        peopleDetail.RepeatID = "";
                        peopleDetail.UploadResultMsg = "";
                        peopleDetail.UploadTime = "";
                    }
                    else {

                        if (peopleDetail.UploadResult > 1)
                            peopleDetail.UploadResult = '<span class="label_error" ><i class="fa fa-exclamation-triangle "></i>' +
                                faceAPI.UploadResultTable[peopleDetail.UploadResult] + '</span>';
                        else
                            peopleDetail.UploadResult = `<span class="label label_upload" >${getLanguage('access.a52')}</span>`;


                        if (peopleDetail.RepeatID == 0)
                            peopleDetail.RepeatID = "";
                        else
                            peopleDetail.RepeatID = '<span class="label_error" >' + peopleDetail.RepeatID + '</span>';

                        if (peopleDetail.hasOwnProperty("UploadResultMsg") == false)
                            peopleDetail.UploadResultMsg = "";
                        if (peopleDetail.UploadResultMsg.length > 0)
                            peopleDetail.UploadResultMsg = '<span class="label_error" >' + peopleDetail.UploadResultMsg + '</span>';

                    }

                    peopleDetail.UploadStatus = faceAPI.UploadStatusTable[peopleDetail.UploadStatus];



                    bindStatusDiv(peopleDetail);

                    var elems = $('div[lay-filter="access_edit_div_filter"] div[lay-filter="OpenTimes"]')

                    if (peopleDetail.OpenTimes >= 65535) {
                        peopleDetail.OpenTimes = 65535;
                        peopleDetail.UseOpenTimes = 1;
                        elems.addClass("layui-hide");
                    }
                    else {
                        peopleDetail.UseOpenTimes = 0;
                        elems.removeClass("layui-hide");
                    }

                    //加载完毕
                    var fromdata = peopleDetail;
                    form.val("access_edit_div_filter", peopleDetail);
                    makeCode(fromdata.QRCode);

                    if (fromdata.PhotoLen != undefined && fromdata.PhotoLen > 0) {
                        $("#peopleImage").find("img").remove();
                        $("#peopleImage").append(
                            '<img id="showPeopleImg" src="' +
                            fromdata.Photo +
                            '" width="240">'
                        );
                        //图片预览
                        this.previewPictureClick("showPeopleImg");
                    }
                    var elevatorCheckData = [];
                    var HolidaysCheckData = [];
                    if (
                        fromdata.Elevators != undefined &&
                        fromdata.Elevators.length > 0
                    ) {
                        elevatorCheckData = fromdata.Elevators.split(",");
                    }
                    if (fromdata.Holidays != undefined && fromdata.Holidays.length > 0) {
                        if (fromdata.Holidays == "*") {
                            for (var i = 1; i <= 30; i++) HolidaysCheckData.push(i);
                        } else {
                            HolidaysCheckData = fromdata.Holidays.split(",");
                        }
                    }

                    var elevatorData = this.CreateTableData(64, elevatorCheckData);
                    var elevator = this.CreateTable(
                        "ID-table-Elevator",
                        getLanguage("people.p94"),
                        elevatorData
                    );
                    var HolidaysData = this.CreateTableData(32, HolidaysCheckData);
                    var Holidays = this.CreateTable(
                        "ID-table-Holidays",
                        getLanguage("people.p95"),
                        HolidaysData
                    );
                    //$($('[name="elevatorCount"]')[0]).html(elevatorCheckData.length);

                    //$($('[name="HolidaysCount"]')[0]).html(HolidaysCheckData.length);
                    this.loadHolidays(Holidays, HolidaysCheckData);
                    this.LoadElevator(elevator, elevatorCheckData);

                },
                loadHolidays: function (Holidays, HolidaysCheckData) {
                    var HolidaysCount = HolidaysCheckData.length;
                    var HolidaysDiv = $("#HolidaysCount");
                    HolidaysDiv.html(HolidaysCount); //显示已选择节假日数量
                    var HolidaysTotaal = 32; //节假日总数量
                    Holidays.on("checkbox(ID-table-Holidays)", function (obj) {
                        var ch = obj.checked;
                        if (obj.type == "all") {
                            HolidaysCount = ch ? HolidaysTotaal : 0;
                        } else {
                            HolidaysCount = ch ? HolidaysCount + 1 : HolidaysCount - 1;
                        }
                        HolidaysDiv.html(HolidaysCount);
                    });
                },
                LoadElevator: function (elevator, elevatorCheckData) {
                    var elevatorDiv = $("#elevatorCount");
                    var elevatorCount = elevatorCheckData.length;
                    elevatorDiv.html(elevatorCount);
                    elevator.on("checkbox(ID-table-Elevator)", function (obj) {
                        var ch = obj.checked;
                        if (obj.type == "all") {
                            elevatorCount = ch ? 64 : 0;
                        } else {
                            elevatorCount = ch ? elevatorCount + 1 : elevatorCount - 1;
                        }
                        elevatorDiv.html(elevatorCount);
                    });
                },
                /**
                 *
                 * 图片预览点击事件
                 * @param {any} elem
                 */
                previewPictureClick: function (elem) {
                    var idBar = "#" + elem;
                    $(idBar).on("click", function () {
                        var src = $(idBar)[0].src;
                        //debugger;
                        var width = $(idBar).width();
                        var height = $(idBar).height();
                        var scaleWH = width / height;
                        var bigH = 800;
                        var bigW = scaleWH * bigH;
                        if (bigW > 1000) {
                            bigW = 1000;
                            bigH = bigW / scaleWH;
                        } // 放大预览图片
                        parent.layer.open({
                            type: 1,
                            title: false,
                            closeBtn: 1,
                            shadeClose: true,
                            area: [bigW + "px", bigH + "px"], //宽高
                            content: '<img width="' + bigW + '" src="' + src + '" />',
                        });
                    });
                },
                /**
                 *
                 * 绑定表单提交事件
                 * @param {any} elem
                 */
                formSubmitBind: function (elem) {
                    var that = this;
                    form.on("submit(" + elem + ")", function (data) {
                        var postdata = data.field;

                        delete postdata.layTableCheckbox;

                        postdata.AccessID = peopleDetail.AccessID;

                        

                        var UseOpenTimes = postdata.UseOpenTimes == "1" ? 1 : 0;

                        if (UseOpenTimes == 1) {
                            postdata.OpenTimes = 65535;
                            delete postdata["UseOpenTimes"];
                        }
                        else {
                            if (postdata.OpenTimes == "")
                                postdata.OpenTimes = 0;
                            else
                                postdata.OpenTimes = Number(postdata.OpenTimes);
                        }

                        postdata.Timegroup = Number(postdata.Timegroup);
                        postdata.AccessType = Number(postdata.AccessType);

                        postdata.KeepOpen = postdata.KeepOpen == 1 ? 1 : 0;

                        var formData = that.getFormData(postdata);

                        loadIndex = layer.load(1, { shade: [0.6, "#e2e2e2"] }); //0.1透明度的白色背景

                        faceAPI.AjaxPOSTJson({
                            type: "Post",
                            data: formData,
                            contentType: false,
                            processData: false,
                            url: "/api/DeviceAccess/UpdateAccess",
                            success: function (result) {
                                layer.close(loadIndex);

                                result.Content = formData;
                                faceAPI.AccessEditPageResult = result;
                                layer.close(parentIndex);

                            },
                        });

                        return false;
                    });
                },
                /**
                 *
                 * 获取表单数据
                 * @param {any} postdata 需要提交的数据
                 * @returns
                 */
                getFormData: function (postdata) {

                    //获取电梯权限
                    var elevatorData = table.checkStatus("ID-table-Elevator").data;
                    if (elevatorData.length > 0) {
                        var Elevators = [];
                        for (var i = 0; i < elevatorData.length; i++)
                            Elevators.push(elevatorData[i].num);

                        postdata.Elevators = Elevators.join(",");
                    } else {
                        postdata.Elevators = "";
                    }

                    var HolidaysData = table.checkStatus("ID-table-Holidays").data;
                    if (HolidaysData.length > 0) {
                        var Holidays = [];
                        for (var i = 0; i < HolidaysData.length; i++)
                            Holidays.push(HolidaysData[i].num);

                        postdata.Holidays = Holidays.join(",");
                    } else {
                        postdata.Holidays = "";
                    }
                    return postdata;
                },
                /**
                 *
                 * 取消操作，关闭窗口事件
                 * @param {any} elem
                 */
                cancelClick: function (elem) {
                    $("#" + elem).on("click", function () {
                        faceAPI.AccessEditPageResult = {
                            Result: false,
                        };

                        layer.close(parentIndex);
                        return false;
                    });
                },

            };

            var parentIndex = layer.index;

            peopleEdit.setParentIndex(parentIndex);
            //创建开门时段下拉框
            peopleEdit.createTimeGroup("Timegroup");

            //时间控件
            peopleEdit.createLaydate(
                "ExpirationDate",
                dayjs().add(1, "Year").format("YYYY-MM-DD") + " 23:59:59"
            );

            ////加载人员信息
            peopleEdit.GetUserDetail();



            ////图片预览
            peopleEdit.previewPictureClick("showPeopleImg");

            ////绑定提交事件
            peopleEdit.formSubmitBind("saveBtn");
            ////取消操作，关闭窗口
            peopleEdit.cancelClick("BtnAccessEditCancel");


           

            form.on('switch(UseOpenTimes)', function (data) {


                var elem = data.elem;
                var elemName = elem.name;
                var models = form.val("access_edit_div_filter");

                models.UseOpenTimes = models.UseOpenTimes == "1" ? 1 : 0;

                var elems = $('div[lay-filter="access_edit_div_filter"] div[lay-filter="OpenTimes"]')

                if (models.UseOpenTimes == 1) {
                    elems.addClass("layui-hide");

                }
                else {
                    elems.removeClass("layui-hide");
                }



                form.render();


                return false;
            });


            faceAPI.CheckInputBox();

            var qrcode = new QRCode(document.getElementById("qrcode"), {
                width: 300,
                height: 300
            });

            function makeCode(QRCodevalue) {
                if (QRCodevalue == undefined)
                    QRCodevalue = "";
                if (QRCodevalue.length > 0) {
                    qrcode.makeCode(QRCodevalue);
                }
                else {
                    var qrcodeimg = $("#qrcode img");
                    qrcodeimg.attr("src", "");
                }


            }

            function bindStatusDiv(formdata) {
                var _page = $('div[lay-filter="access_edit_div_filter"] div[autoset]');
                _page.each((ind, em) => {
                    var _em = $(em);
                    var name = _em.attr("name");
                    if (formdata.hasOwnProperty(name))
                        _em.html(formdata[name]);
                });
            }


        }
    );
</script>
