<div class="layuimini-main" id="access-search">

    <form class="layui-form layui-form-pane" lay-filter="access-search_div_filter">
        <div class="layui-form-item">
            <div class="layui-inline">
                <label class="layui-form-label">
                    <span language="people.p51">人员编号</span>
                </label>
                <div class="layui-input-inline">
                    <input type="number" max="4294967295" min="1" maxlength="10" name="UserID" autocomplete="off"
                           class="layui-input">
                </div>
            </div>
            <div class="layui-inline">
                <label class="layui-form-label">
                    <span language="people.p52">人员姓名</span>
                </label>
                <div class="layui-input-inline">
                    <input type="text" maxlength="30" name="Name" autocomplete="off" class="layui-input">
                </div>
            </div>
            <div class="layui-inline">
                <label class="layui-form-label">
                    <span language="people.p53">卡号</span>
                </label>
                <div class="layui-input-inline">
                    <input type="number"
                           max="18446744073709550000"
                           min="0"
                           maxlength="20"
                           name="CardNum"
                           value=""
                           class="layui-input" />
                </div>
            </div>

        </div>
        <div class="layui-form-item">
            <div class="layui-inline">
                <label class="layui-form-label" language="device.d2">设备SN</label>
                <div class="layui-input-inline">
                    <input type="text" maxlength="16" name="SN" autocomplete="off"
                           class="layui-input">
                </div>
            </div>
            <div class="layui-inline">
                <label class="layui-form-label" language="device.d3">设备名称</label>
                <div class="layui-input-inline">
                    <input type="text" maxlength="30" name="DeviceName" autocomplete="off"
                           class="layui-input">
                </div>
            </div>
            <div class="layui-inline">
                <label class="layui-form-label" language="device.Protocol">协议类型</label>
                <div class="layui-input-inline">
                    <select name="Protocol" lay-verify="">
                        <option value="" selected></option>
                        <option value="HTTPv1">HTTPv1</option>
                        <option value="HTTPv2">HTTPv2</option>
                        <option value="MQTT">MQTT</option>
                        <option value="Websocket">Websocket</option>
                    </select>
                </div>
            </div>


        </div>
        <div class="layui-form-item">
            <div class="layui-inline">
                <label class="layui-form-label" language='access.a179'>角色</label>
                <div class="layui-input-inline">
                    <select name="AccessType" >
                        <option value="" selected></option>
                        <option value="0" language='access.a181'>用户</option>
                        <option value="1" language='access.a182'>管理员</option>
                        <option value="2" language='access.a183'>黑名单</option>
                    </select>
                </div>
            </div>
            <div class="layui-inline">
                <label class="layui-form-label" language='access.a184' >上传状态</label>
                <div class="layui-input-inline">
                    <select name="UploadStatus" >
                        <option value="" selected></option>
                        <option value="0" language='access.a186'>未上传</option>
                        <option value="1" language='access.a187'>已上传</option>
                        <option value="2" language='access.a188'>待删除</option>
                    </select>
                </div>
            </div>

            <div class="layui-inline">
                <label class="layui-form-label" language='access.a189' >上传结果</label>
                <div class="layui-input-inline">
                    <select name="UploadResult" >
                        <option value="" selected></option>
                        <option value="1" language='access.a192'>已上传,无异常</option>
                        <option value="2" language='access.a191'>已上传，有异常</option>
                    </select>
                </div>
            </div>
        </div>
        <div class="layui-form-item">

            <div class="layui-inline">
                <label class="layui-form-label">
                    <span language="people.regQRCode">登记二维码</span>
                </label>
                <div class="layui-input-inline selectUp">
                    <select name="QRCode"  lay-verify="">
                        <option value="" selected></option>
                        <option value="1" language='people.p57'>已登记</option>
                        <option value="2" language='people.p58'>未登记</option>
                    </select>

                </div>
            </div>

            <div class="layui-inline">
                <label class="layui-form-label">
                    <span language="people.p55">登记照片</span>
                </label>
                <div class="layui-input-inline selectUp">
                    <select name="Photo"  lay-verify="">
                        <option value="" selected></option>
                        <option value="1" language='people.p57'>已登记</option>
                        <option value="2" language='people.p58'>未登记</option>
                    </select>

                </div>
            </div>
            <div class="layui-inline">
                <label class="layui-form-label">
                    <span language="people.regPassword">登记密码</span>
                </label>
                <div class="layui-input-inline selectUp">
                    <select name="Password"  lay-verify="">
                        <option value="" selected></option>
                        <option value="1" language='people.p57'>已登记</option>
                        <option value="2" language='people.p58'>未登记</option>
                    </select>

                </div>
            </div>
        </div>
        <div class="layui-form-item">

            <div class="layui-inline">
                <label class="layui-form-label">
                    <span language="people.regFace">登记人脸特征码</span>
                </label>
                <div class="layui-input-inline selectUp">
                    <select name="Face"  lay-verify="">
                        <option value=""  selected></option>
                        <option value="1" language='people.p57'>已登记</option>
                        <option value="2" language='people.p58'>未登记</option>
                    </select>

                </div>
            </div>
            <div class="layui-inline">
                <label class="layui-form-label">
                    <span language="people.regFP">登记指纹</span>
                </label>
                <div class="layui-input-inline selectUp">
                    <select name="Fingerprints"  lay-verify="">
                        <option value=""  selected></option>
                        <option value="1" language='people.p57'>已登记</option>
                        <option value="2" language='people.p58'>未登记</option>
                    </select>

                </div>
            </div>
            <div class="layui-inline">
                <label class="layui-form-label">
                    <span language="people.regPalm">登记掌静脉</span>
                </label>
                <div class="layui-input-inline selectUp">
                    <select name="Palmveins"  lay-verify="">
                        <option value=""  selected></option>
                        <option value="1" language='people.p57'>已登记</option>
                        <option value="2" language='people.p58'>未登记</option>
                    </select>

                </div>
            </div>
        </div>
        <div class="layui-form-item">
            <div class="layui-inline">
                <button type="submit" class="layui-btn layui-btn-primary" lay-submit lay-filter="data-search-btn">
                    <i class="layui-icon">&#xe615;</i>

                    <span language='access.a193'> 搜索</span>
                </button>
                <button type="reset" class="layui-btn layui-btn-primary" language='access.a194'>重置</button>
                <button type="submit" class="layui-btn layui-btn-primary" id="btnsearchclose">
                    <i class="layui-icon">&#x1006;</i>
                    <span language='access.a195'>取消</span>
                </button>
            </div>
        </div>
    </form>

</div>
<script>
    setLanguage();
    setAllAttrVal()
    layui.use(['form', 'table', 'faceAPI'], function () {
        var form = layui.form,
            layer = layui.layer,
            table = layui.table,
            $ = layui.$;
        var faceAPI = layui.faceAPI;
        /**
         * 初始化表单，要加上，不然刷新部分组件可能会不加载
         */
        form.render();

        // 当前弹出层，防止ID被覆盖
        var parentIndex = layer.index;

        if (faceAPI.AccessSearchPageResult != null) {
            form.val("access-search_div_filter", faceAPI.AccessSearchPageResult.field);
        } else
            faceAPI.AccessSearchPageResult = {};

        faceAPI.AccessSearchPageResult.Result = false;
        //监听提交
        form.on('submit(data-search-btn)', function (data) {
            var result = data.field;
            var result = data.field;


            if (result.UserID == "") result['UserID'] = null;
            if (result.Name == "") result['Name'] = null;
            if (result.CardNum == "") result.CardNum = null;

            if (result.SN == "") result['SN'] = null;
            if (result.DeviceName == "") result['DeviceName'] = null;
            if (result.Protocol == "") result['Protocol'] = null;

            
            if (result.AccessType == "")
                result['AccessType'] = null;
            else
                result['AccessType'] = Number(result['AccessType']);


            if (result.UploadStatus == "")
                result['UploadStatus'] = null;
            else
                result['UploadStatus'] = Number(result['UploadStatus']);


            if (result.UploadResult == "")
                result['UploadResult'] = null;
            else
                result['UploadResult'] = Number(result['UploadResult']);

            if (result.QRCode == "")
                result.QRCode = null;
            else
                result.QRCode = result.QRCode == "1" ? 1 : 0;


            if (result.Photo == "")
                result.Photo = null;
            else
                result.Photo = result.Photo == "1" ? 1 : 0;

            if (result.Password == "")
                result.Password = null;
            else
                result.Password = result.Password == "1" ? 1 : 0;



            if (result.Face == "")
                result.Face = null;
            else
                result.Face = result.Face == "1" ? 1 : 0;



            if (result.Fingerprints == "")
                result.Fingerprints = null;
            else
                result.Fingerprints = result.Fingerprints == "1" ? 1 : 0;

            if (result.Palmveins == "")
                result.Palmveins = null;
            else
                result.Palmveins = result.Palmveins == "1" ? 1 : 0;


            faceAPI.AccessSearchPageResult.Result = true;
            faceAPI.AccessSearchPageResult.field = result;
            layer.close(parentIndex);
            return false;
        });


        $('#btnsearchclose').on('click', function () {
            faceAPI.AccessSearchPageResult.Result = false
            layer.close(parentIndex);
            return false;
        });

        faceAPI.CheckInputBox();
    });

</script>
