<div class="layuimini-main" id="Access-add">
    <style>
        .defcenter {
            text-align: center;
        }

        .lay-step {
            padding-left: 100px;
        }
    </style>

    <div class="layui-card">
        <div class="layui-card-body" style="padding-top: 40px;">
            <div class="layui-carousel" id="stepForm" lay-filter="stepForm" style="margin: 0 auto;">
                <div carousel-item>
                    <div>
                        <form class="layui-form" style="margin: 0 auto;max-width: 800px;padding-top: 40px;">
                            <div class="layui-card">
                                <div class="layui-card-header">
                                    <h2 language='access.a70'>选择需要操作的门</h2>
                                </div>
                                <div class="layui-card-body">
                                    <div>
                                        <table class="layui-hide" id="AccessDeviceTable"
                                               lay-filter="AccessDeviceTableFilter"></table>
                                    </div>
                                    <div class="layui-panel defcenter">
                                        <button class="layui-btn" lay-submit lay-filter="btnSelectDoorOver"
                                                language='access.a71'>
                                            下一步
                                        </button>
                                    </div>
                                </div>
                            </div>
                        </form>
                    </div>
                    <div>
                        <form class="layui-form" style="margin: 0 auto;max-width: 800px;padding-top: 40px;">
                            <div class="layui-card">
                                <div class="layui-card-header">
                                    <h2 language='access.a72'>选择需要操作的人员</h2>
                                </div>
                                <div class="layui-card-body">
                                    <div>
                                        <table class="layui-hide" id="AccessPeoplePageTable"
                                               lay-filter="AccessPeoplePageTableFilter"></table>
                                    </div>
                                    <div class="layui-panel defcenter">
                                        <button type="button" class="layui-btn layui-btn-primary"
                                                id="btnSelectPeopleAll" language='access.a73'>
                                            <i class="layui-icon">&#xe615;</i>选择所有
                                        </button>
                                        <button type="button" class="layui-btn layui-btn-primary" id="btnSearchPeople"
                                                language='access.a74'>
                                            <i class="layui-icon">&#xe615;</i>筛选
                                        </button>
                                        <button type="button" class="layui-btn layui-btn-primary pre"
                                                language='access.a75'>
                                            上一步
                                        </button>
                                        <button class="layui-btn" lay-submit lay-filter="btnSelectPeopleOver"
                                                language='access.a76'>
                                            下一步
                                        </button>
                                    </div>
                                </div>
                            </div>
                        </form>
                    </div>
                    <div>
                        <form class="layui-form" style="margin: 0 auto;max-width: 800px;padding-top: 40px;" lay-filter="access-filter">
                            <div class="layui-card">
                                <div class="layui-card-header">
                                    <h2 language='access.a77'>设置人员的权限详情</h2>
                                </div>
                                <div class="layui-card-body">

                                    <div class="layui-form-block">
                                        <div class="layui-form-item">
                                            <label class="layui-form-label" language='access.a78'>开门时段</label>
                                            <div class="layui-input-block">

                                                <select name="Timegroup" lay-verify="">
                                                    <option value="1" selected language='access.a79'>时段1</option>
                                                </select>
                                            </div>
                                        </div>

                                        <div class="layui-form-item">
                                            <label class="layui-form-label" language='access.a80'>人员角色</label>
                                            <div class="layui-input-block">
                                                <select name="AccessType" lay-verify="">
                                                    <option value="0" selected language='access.a81'>用户</option>
                                                    <option value="1" language='access.a82'>管理员</option>
                                                    <option value="2" language='access.a83'>黑名单</option>
                                                </select>
                                            </div>
                                        </div>
                                        <div class="layui-form-item">
                                            <label class="layui-form-label" language="people.p105">
                                                常开卡
                                            </label>
                                            <div class="layui-input-inline">
                                                <input type="checkbox"
                                                       name="KeepOpen"
                                                       lay-skin="switch"
                                                       data-lang="lay-text"
                                                       id="people.p93"
                                                       lay-text="是|否"
                                                       unchecked
                                                       value="1" />
                                            </div>
                                        </div>
                                        <div class="layui-form-item">
                                            <label class="layui-form-label" language='access.a88'>截止时间</label>
                                            <div class="layui-input-block">
                                                <input type="text" maxlength="20" name="ExpirationDate"
                                                       lay-verify="required" autocomplete="off" class="layui-input">
                                            </div>
                                        </div>
                                        <div class="layui-form-item">

                                            <div class="layui-inline">
                                                <label class="layui-form-label" language="people.UseOpenTimes">次数限制</label>
                                                <div class="layui-input-inline">
                                                    <input type="checkbox" name="UseOpenTimes" lay-skin="switch" lay-filter="UseOpenTimes" checked
                                                           data-lang='lay-text' lay-text="无限制|限制次数" value="1" id="people.UseOpenTimesText">
                                                </div>
                                            </div>
                                            <div class="layui-inline layui-hide" lay-filter="OpenTimes">
                                                <label class="layui-form-label" language="people.OpenTimes">通行次数</label>
                                                <div class="layui-input-inline">
                                                    <input type="number"
                                                           max="65535"
                                                           min="0"
                                                           maxlength="5"
                                                           name="OpenTimes"
                                                           autocomplete="off"
                                                           class="layui-input" />
                                                </div>
                                            </div>
                                        </div>




                                    </div>
                                </div>

                                <div class="layui-panel defcenter">
                                    <button type="button" class="layui-btn layui-btn-primary pre"
                                            language='access.a91'>
                                        上一步
                                    </button>
                                    <button class="layui-btn layui-bg-blue" lay-submit lay-filter="btnAddAccess"
                                            language='access.a92'>
                                        允许开门
                                    </button>
                                    <button class="layui-btn layui-btn-danger data-delete-btn" lay-submit
                                            lay-filter="btnDeleteAccess" language='access.a93'>
                                        禁止开门
                                    </button>
                                    <button class="layui-btn" lay-submit lay-filter="btnAccessOver"
                                            language='access.a76'>
                                        下一步
                                    </button>
                                </div>

                            </div>
                        </form>
                    </div>
                    <div>
                        <form class="layui-form" style="margin: 0 auto;max-width: 800px;padding-top: 40px;">
                            <div class="layui-card">
                                <div class="layui-card-header">
                                    <h2  language='access.selectHoliday'>选择需要受限的节假日</h2>
                                </div>
                                <div class="layui-card-body">
                                    <div>
                                        <table id="AccessHolidayTable"
                                               lay-filter="AccessHolidayTableFilter"></table>
                                    </div>
                                    <div class="layui-panel defcenter">
                                        <button type="button" class="layui-btn layui-btn-primary pre"
                                                language='access.a91'>
                                            上一步
                                        </button>
                                        <button class="layui-btn layui-bg-blue" lay-submit lay-filter="btnAddAccess"
                                                language='access.a92'>
                                            允许开门
                                        </button>
                                        <button class="layui-btn layui-btn-danger data-delete-btn" lay-submit
                                                lay-filter="btnDeleteAccess" language='access.a93'>
                                            禁止开门
                                        </button>
                                        <button class="layui-btn" lay-submit lay-filter="btnSelectHolidayOver"
                                                language='access.a76'>
                                            下一步
                                        </button>
                                    </div>
                                </div>
                            </div>
                        </form>

                    </div>
                    <div>
                        <form class="layui-form" style="margin: 0 auto;max-width: 800px;padding-top: 40px;">
                            <div class="layui-card">
                                <div class="layui-card-header">
                                    <h2  language='access.selectElevator'>选择需要授权的电梯权限</h2>
                                </div>
                                <div class="layui-card-body">
                                    <div>
                                        <table class="layui-hide" id="AccessElevatorTable"
                                               lay-filter="AccessElevatorTableFilter"></table>
                                    </div>
                                    <div class="layui-panel defcenter">
                                        <button type="button" class="layui-btn layui-btn-primary pre"
                                                language='access.a91'>
                                            上一步
                                        </button>
                                        <button class="layui-btn layui-bg-blue" lay-submit lay-filter="btnAddAccess"
                                                language='access.a92'>
                                            允许开门
                                        </button>
                                        <button class="layui-btn layui-btn-danger data-delete-btn" lay-submit
                                                lay-filter="btnDeleteAccess" language='access.a93'>
                                            禁止开门
                                        </button>
                                    </div>
                                </div>
                            </div>
                        </form>

                    </div>
                </div>
            </div>
        </div>
    </div>

</div>

<script>
    setLanguage();
    setAllAttrVal()

    layui.use(['form', 'laydate', 'miniPage', 'table', 'faceAPI', 'step', 'slider'], function () {
        var form = layui.form,
            layer = layui.layer,
            table = layui.table,
            step = layui.step,
            $ = layui.$;



        var slider = layui.slider;
        var faceAPI = layui.faceAPI;
        var laydate = layui.laydate;
        var miniPage = layui.miniPage;

        //初始化时段列表
        var TimeGroups = [];
        for (var i = 1; i < 65; i++) {
            var sItem = ' <option value="' + i + '" ';
            if (i == 1) sItem += ' selected';
            sItem += `> ${getLanguage('access.a94')}` + i + '</option> '; //时段 x
            TimeGroups.push(sItem);
        }
        $('[name=Timegroup]').html(TimeGroups.join(''));

        /**
         * 初始化表单，要加上，不然刷新部分组件可能会不加载
         */
        form.render();

        //次数限制
        form.on('switch(UseOpenTimes)', function (data) {
  
            var elem = data.elem;
            var elemName = elem.name;
            var models = form.val("access-filter");

            models.UseOpenTimes = models.UseOpenTimes == "1" ? 1 : 0;

            var elems = $('form[lay-filter="access-filter"] div[lay-filter="OpenTimes"]')

            if (models.UseOpenTimes == 1) {
                elems.addClass("layui-hide");

            }
            else {
                elems.removeClass("layui-hide");
            }



            form.render();


            return false;
        });


        //执行一个laydate实例
        laydate.render({
            elem: '[name="ExpirationDate"]', //指定元素
            type: 'datetime'
        });
        $('[name="ExpirationDate"]').attr("value", dayjs().add(1, 'Year').format("YYYY-MM-DD") + ' 23:59:59');

        step.render({
            elem: '#stepForm',
            filter: 'stepForm',
            width: '100%', //设置容器宽度
            stepWidth: '800px',
            height: '650px',
            stepItems: [{
                title: getLanguage('access.a97')//选择门
            }, {
                title: getLanguage('access.a98')//选择人员
            }, {
                title: getLanguage('access.a99')//'设置权限'
            }, {
                title: getLanguage('access.Holiday')//'节假日'
            }, {
                title: getLanguage('access.Elevator')//'电梯权限'
            }]
        });

        // 当前弹出层，防止ID被覆盖
        var parentIndex = layer.index;

        faceAPI.AccessAddPageResult = null;

        form.on('submit(btnSelectDoorOver)', function (data) {
            var checkStatus = table.checkStatus('AccessDeviceTable')
                , data = checkStatus.data;
            if (data.length == 0) {
                layer.open({
                    title: getLanguage('access.a100'),//提示
                    content: getLanguage('access.a101'),//请勾选需要进行授权操作的门
                    icon: 2
                });
                return false;
            }
            step.next('#stepForm');
            return false;
        });

        form.on('submit(btnAccessOver)', function (data) {
            step.next('#stepForm');
            return false;
        });


        $('.pre').click(function () {
            step.pre('#stepForm');
        });

        $('.next').click(function () {
            step.next('#stepForm');
        });


        form.on('submit(btnAddAccess)', function (data) {
            PostAccess(1);

            return false;
        });


        form.on('submit(btnDeleteAccess)', function (data) {
            PostAccess(0);
            //step.next('#stepForm');
            return false;
        });

        //提交权限--自选人员
        function PostAccess(isAddAccess) {

            //权限详情
            
            var oAccessDetail = form.val('access-filter');
            

            //门列表
            var doorCheckStatus = table.checkStatus('AccessDeviceTable')
                , doorData = doorCheckStatus.data;
            var DeviceIDs = [];
            doorData.forEach(function (item, index) { DeviceIDs.push(item.ID); });

            //有效次数
            var UseOpenTimes = oAccessDetail.UseOpenTimes == "1" ? 1 : 0;
            if (UseOpenTimes == 1) {
                oAccessDetail.OpenTimes = 65535;
                delete oAccessDetail["UseOpenTimes"];
            }
            else {
                if (oAccessDetail.OpenTimes == "")
                    oAccessDetail.OpenTimes = 0;
                else
                    oAccessDetail.OpenTimes = Number(oAccessDetail.OpenTimes);
            }


            //节假日
            var holidayCheckStatus = table.checkStatus('AccessHolidayTable').data;
            if (holidayCheckStatus.length > 0) {
                var nums = [];
                holidayCheckStatus.forEach(function (item, index) { nums.push(item.num); });
                oAccessDetail.Holidays = nums.join(",");
            }
            //电梯
            var elevatorrelayCheckStatus = table.checkStatus('AccessElevatorTable').data;
            if (elevatorrelayCheckStatus.length > 0) {
                var nums = [];
                elevatorrelayCheckStatus.forEach(function (item, index) { nums.push(item.num); });
                oAccessDetail.Elevators = nums.join(",");
            }
            if (bSelectPeopleAll) {
                PostAccess_ALL(isAddAccess, DeviceIDs, oAccessDetail);
                return;
            }


            //人员列表
            var peopleCheckStatus = table.checkStatus('AccessPeoplePageTable')
                , peopleData = peopleCheckStatus.data;
            var PeopleIDs = [];
            peopleData.forEach(function (item, index) { PeopleIDs.push(item.ID); });

            var postPar = { DeviceIDs, PeopleIDs };
            $.extend(postPar, oAccessDetail);
            

            var sURL = '/api/DeviceAccess/AddAccess';
            if (isAddAccess == 0)
                sURL = '/api/DeviceAccess/DeleteAccess';

            PostData(postPar, sURL);
            
        }

        //提交所有人员的权限
        //iAccessType 1--授权；0--删除权限
        function PostAccess_ALL(isAddAccess, DeviceIDs, oAccessDetail) {
            var postPar = { DeviceIDs };
            $.extend(postPar, oAccessDetail);
            

            var sURL = '/api/DeviceAccess/AddAccess_AllPeople';
            if (isAddAccess == 0)
                sURL = '/api/DeviceAccess/DeleteAccess_AllPeople';

            PostData(postPar, sURL);
        };

        function PostData(postPar,sURL) {
            var loadIndex = 0;
            loadIndex = layer.load(1, { shade: [0.6, '#e2e2e2'] }); //0.1透明度的白色背景
            console.log(postPar);
            faceAPI.AjaxPOSTJson({
                data: postPar,
                url: sURL,
                timeout: 9999999,
                success: function (result) {
                    layer.close(loadIndex);
                    if (result.Result == false) {
                        layer.alert(result.Error, { icon: 2 });
                    }
                    else {
                        //$.extend(result.Content, postdata);
                        faceAPI.AccessAddPageResult = result;

                        layer.close(parentIndex);
                    }
                }
            });
        }

        
        //加载门列表
        table.render({
            height: 450,
            elem: '#AccessDeviceTable',
            //**************************异步请求开始***********************
            url: 'api/Device/Query',
            method: 'post',
            contentType: "application/json",
            headers: {
                Authorization: "Bearer " + faceAPI.GetJWTToken()
            },//增加Token验证头
            request: {
                pageName: 'PageIndex', //页码的参数名称，默认：page
                limitName: 'PageSize' //每页数据量的参数名，默认：limit
            },
            parseData: function (res) { //res 即为原始返回的数据
                if (res.ErrCode == 0) {
                    var data = res.Content;
                    var ret = {
                        "code": res.ErrCode, //解析接口状态
                        "msg": res.Error, //解析提示文本
                        "count": data.TotalCount, //解析数据长度
                        "data": data.DataList //解析数据列表
                    };
                    return ret;

                } else {
                    return {
                        "code": 0, //解析接口状态
                        "msg": '', //解析提示文本
                        "count": 0, //解析数据长度
                        "data": [] //解析数据列表
                    };
                }
            },
            cols: [[
                { type: "checkbox", width: 40 },
                { field: 'SN', width: 160, title: 'SN', sort: true },
                { field: 'DeviceName', width: 200, title: getLanguage('device.d13'), sort: true },//名称
                { field: 'Protocol', width: 100, title: getLanguage('device.Protocol'), sort: true },//协议类型
                { field: 'DeviceVer', width: 100, title: getLanguage('device.d14') },
                {//出入类型 0,入门；1，出门
                    field: 'IsEntry', width: 110, title: getLanguage('device.d15'),
                    templet: function (d) {
                        if (d.IsEntry == 0) return getLanguage('device.d16');//入门
                        return getLanguage('device.d17');//出门
                    }
                },
            ]],
            limits: [100, 200, 500, 1000],
            limit: 100,
            page: true,
            skin: 'line'
        });

        //选择所有人员

        var bSelectPeopleAll = false;
        $('#btnSelectPeopleAll').click(function () {
            bSelectPeopleAll = true;
            step.next('#stepForm');
        });

        form.on('submit(btnSelectPeopleOver)', function (data) {
            var checkStatus = table.checkStatus('AccessPeoplePageTable')
                , data = checkStatus.data;
            if (data.length == 0) {
                layer.open({
                    title: getLanguage('access.a103'),//提示
                    content: getLanguage('access.a104'),//请勾选需要进行授权操作的人员
                    icon: 2,
                });
                return false;
            }
            bSelectPeopleAll = false;
            step.next('#stepForm');
            return false;
        });



        function IniPeopleSearchField() {
            faceAPI.PeopleSearchPageResult = {};
            faceAPI.PeopleSearchPageResult.field = {
                ID: null,
                UserID: null,
                Name: null,
                Job: null,
                Department: null,
                IdentityCard: null,
                Photo: null,
                Password: null,
                CardNum: null,
                QRCode: null,
                UseQRCode: null,
                Face: null,
                Palmveins: null,
                Fingerprints: null,
            };
            faceAPI.PeopleSearchPageResult.Result = false;
        }
        IniPeopleSearchField();
        //筛选
        $('#btnSearchPeople').click(function () {
            var content = miniPage.getHrefContent('page/People/search.html');
            var openWH = miniPage.getOpenWidthHeight();

            var index = layer.open({
                title: getLanguage('access.a105'),
                type: 1,
                shade: 0.2,
                maxmin: false,
                shadeClose: false,
                area: ['700px', '550px'],
                content: content,
                end: function (layero, index) {

                    var rst = faceAPI.PeopleSearchPageResult;
                    if (rst != null && rst.Result) {
                        table.reload('AccessPeoplePageTable', {
                            page: {
                                curr: 1
                            }, where: faceAPI.PeopleSearchPageResult.field
                        }, 'data');
                    };

                }
            });
        });


        //加载人员列表
        table.render({
            height: 450,
            elem: '#AccessPeoplePageTable',
            //**************************异步请求开始***********************
            url: 'api/People/GetPeopleTable',
            method: 'post',
            contentType: "application/json",
            headers: {
                Authorization: "Bearer " + faceAPI.GetJWTToken()
            },//增加Token验证头
            request: {
                pageName: 'PageIndex', //页码的参数名称，默认：page
                limitName: 'PageSize' //每页数据量的参数名，默认：limit
            },
            parseData: function (res) { //res 即为原始返回的数据
                if (res.ErrCode == 0) {
                    var data = res.Content;
                    var ret = {
                        "code": res.ErrCode, //解析接口状态
                        "msg": res.Error, //解析提示文本
                        "count": data.TotalCount, //解析数据长度
                        "data": data.DataList //解析数据列表
                    };
                    return ret;

                } else {
                    return {
                        "code": 0, //解析接口状态
                        "msg": '', //解析提示文本
                        "count": 0, //解析数据长度
                        "data": [] //解析数据列表
                    };
                }

            },
            cols: [[
                { type: "checkbox", width: 50 },
                {
                    field: 'UserID',
                    width: 140,
                    title: getLanguage('people.p10'),
                    sort: true
                },
                {
                    field: 'Name',
                    width: 160,
                    title: getLanguage('people.p11'),
                    sort: true
                },
                { //人员识别凭证
                    field: 'CardNum',
                    width: 300,
                    title: getLanguage('people.p12'),
                    sort: false,
                    templet: function (d) {
                        var sBuf = [];

                        if (d.PhotoLen > 0) {
                            sBuf.push(
                                `<i class="PeopleAccessKey" typeTitle="${getLanguage('people.p14')}" type="image" value = "` + d.Photo + '"><svg t="1690358148845" class="icon" viewBox="0 0 1024 1024" version="1.1" xmlns="http://www.w3.org/2000/svg" p-id="3418" width="20" height="20"><path d="M725.333333 721.066667l-38.4-38.4H379.733333l-38.4 38.4V768h384v-46.933333z m85.333334-38.4v170.666666H256v-170.666666h4.266667l85.333333-85.333334h375.466667l89.6 85.333334z m-85.333334-320c0 106.666667-85.333333 192-192 192S341.333333 469.333333 341.333333 362.666667 426.666667 170.666667 533.333333 170.666667 725.333333 256 725.333333 362.666667z m-85.333333 0C640 302.933333 593.066667 256 533.333333 256S426.666667 302.933333 426.666667 362.666667s46.933333 106.666667 106.666666 106.666666S640 422.4 640 362.666667z" fill="#444444" p-id="3419"></path></svg></i>'
                            );
                        }

                        if (d.hasOwnProperty("Password") == true)
                            if (d.Password.length > 0) {
                                sBuf.push(
                                    `<i class="PeopleAccessKey" typeTitle="${getLanguage('people.p15')}" type="text" value = "` + d.Password + '"><svg t="1690358607999" class="icon" viewBox="0 0 1024 1024" version="1.1" xmlns="http://www.w3.org/2000/svg" p-id="4410" width="20" height="20"><path d="M204.8 390.4A19.2 19.2 0 0 0 185.6 409.6v409.6c0 10.5984 8.6016 19.2 19.2 19.2h614.4a19.2 19.2 0 0 0 19.2-19.2V409.6A19.2 19.2 0 0 0 819.2 390.4H204.8z m96-64V204.8c0-45.9264 37.2736-83.2 83.2-83.2h256c45.9264 0 83.2 37.2736 83.2 83.2v121.6H819.2c45.9264 0 83.2 37.2736 83.2 83.2v409.6c0 45.9264-37.2736 83.2-83.2 83.2H204.8A83.2 83.2 0 0 1 121.6 819.2V409.6c0-45.9264 37.2736-83.2 83.2-83.2h96z m64 0h294.4V204.8a19.2 19.2 0 0 0-19.2-19.2h-256A19.2 19.2 0 0 0 364.8 204.8v121.6z" fill="#5A5A68" p-id="4411"></path><path d="M358.4 646.4a32 32 0 1 1 0-64h307.2a32 32 0 1 1 0 64H358.4z" fill="#5A5A68" p-id="4412"></path></svg></i>'
                                );
                            }
                        if (d.hasOwnProperty("CardNum") == true)
                            if (Number(d.CardNum) > 0) {
                                sBuf.push(

                }
                setLanguage();
                setAllAttrVal()
            }

        function bindPeopleAccessKey() {
            $("[lay-id=AccessPeoplePageTable] i.PeopleAccessKey").mouseenter(AccessKey_mouseenter);
            $("[lay-id=AccessPeoplePageTable] i.PeopleAccessKey").mouseleave(() => {
                if (iMouseenter_TipIndex > 0)
                    layer.close(iMouseenter_TipIndex);
            });
        }

        table.on('sort(AccessPeoplePageTableFilter)', function (obj) {
            bindPeopleAccessKey();
        });

        // 在线离线状态显示提示框
        var iMouseenter_TipIndex = 0;
        function AccessKey_mouseenter() {
            var that = this;
            if (iMouseenter_TipIndex > 0)
                layer.close(iMouseenter_TipIndex);
            var spn = $(that);
            var sType = spn.attr("type");
            var stypeTitle = spn.attr("typeTitle");
            var sValue = spn.attr("value");
            var sHtml = '';//'<div class="layui-card">';
            //sHtml = sHtml + '<div class="layui-card-header">' + stypeTitle + '</div>';
            //sHtml = sHtml + '<div class="layui-card-body">';



            var par = { area: ['240px', '160px'] };
            //debugger;
            if (sType == "text") {

                sHtml = '<h2>' + stypeTitle + '</h2>' + '<h3>' + sValue + '</h3>';
            }
            else {
                par.area[0] = '260px';
                par.area[1] = '380px';
                sHtml = '<h2>' + stypeTitle + '</h2>' + '<img id="showPeopleImg" src="' + sValue + '" width="240"/>';
            }


            //sHtml = sHtml + '</div></div>';

            //console.log(sHtml);
            iMouseenter_TipIndex = layer.tips(sHtml, that, par);
        }
        //   debugger


        //------------------------------------加载节假日---------------------------------------------------
        var holidayRows = [];
        for (var i = 1; i <= 32; i++) {
            holidayRows.push({
                LAY_CHECKED: 1,
                num: i,
            });
        }
            
        table.render({
            elem: "#AccessHolidayTable",
            cols: [
                [
                    //标题栏
                    { type: "checkbox", width: 60 },
                    { field: "num", title: getLanguage('access.Holiday') },//'节假日'
                ],
            ],
            data: holidayRows,
            height: 450,
            limit: 1000, // 每页默认显示的数量
        });

        form.on('submit(btnSelectHolidayOver)', function (data) {
            step.next('#stepForm');
            return false;
        });
        //------------------------------------加载节假日---------------------------------------------------

        var elevatorDatas = [];
        for (var i = 1; i <= 64; i++) {
            elevatorDatas.push({

                num: i
            });
        }
        table.render({
            elem: '#AccessElevatorTable',
            data: elevatorDatas,
            height: 450,
            limit: 1000,
            cols: [[
                { type: 'checkbox' },
                { field: 'num', width: 700, title: getLanguage('access.Elevator'), sort: true }//'电梯权限'
            ]]
        });
