<div class="layuimini-container layuimini-page-anim" divname="timeGroup-page">
    <div class="layuimini-main">

        <script type="text/html" id="toolbarDemo">
            <div class="layui-btn-container">
                <button class="layui-btn layui-btn-normal layui-btn-sm data-add-btn" lay-event="add">
                    <span language="people.p2" tt="添加"></span>
                </button>
                <button class="layui-btn layui-btn-sm layui-btn-danger data-delete-btn" lay-event="delete">
                    <span language="people.p3" tt="删除"></span>
                </button>
                <button class="layui-btn layui-btn-normal layui-btn-sm" lay-event="reload" language='TimeGroup.t1' tt="刷新"> </button>
                <button class="layui-btn layui-btn-sm layui-btn-danger data-delete-btn" lay-event="btnRecover" language='TimeGroup.t2' tt="恢复默认值"></button>
                <!--<button class="layui-btn layui-btn-normal layui-btn-sm data-add-btn" lay-event="TestData" language='TimeGroup.TestData' tt="填充测试数据"></button>-->
            </div>
        </script>

        <table class="layui-hide" id="timeGroupPageTable" lay-filter="currentTableFilter"></table>

        <script type="text/html" id="currentTableBar">
            <a class="layui-btn layui-btn-normal layui-btn-xs data-count-edit" lay-event="edit"
               language='TimeGroup.t3' tt="编辑"></a>
            <button class="layui-btn layui-btn-sm layui-btn-danger data-delete-btn" lay-event="delete">
                <span language="people.p3" tt="删除"></span>
            </button>
        </script>

    </div>
</div>

<script>
    layui.use(['form', 'table', 'miniPage', 'element', 'faceAPI'], function () {
        var $ = layui.jquery,
            form = layui.form,
            table = layui.table,
            miniPage = layui.miniPage;
        var faceAPI = layui.faceAPI;

        table.render({
            elem: '#timeGroupPageTable',
            //**************************异步请求开始***********************
            url: 'api/TimeGroup/GetList',
            contentType: "application/json",
            method: 'post',
            headers: {
                Authorization: "Bearer " + faceAPI.GetJWTToken()
            }, //增加Token验证头
            request: {
                pageName: 'PageIndex', //页码的参数名称，默认：page
                limitName: 'PageSize' //每页数据量的参数名，默认：limit
            },
            parseData: function (res) { //res 即为原始返回的数据
                if (res.ErrCode == 0) {
                    var data = res.Content;
                    var ret = {
                        "code": res.ErrCode, //解析接口状态
                        "msg": res.Error, //解析提示文本
                        "count": data.TotalCount, //解析数据长度
                        "data": data.DataList //解析数据列表
                    };
                    return ret;

                } else {
                    /*layer.open({
                        title: '请求错误',
                        content: '(' + res.ErrCode + ')' + res.Error
                    });  */

                    return {
                        "code": 0, //解析接口状态
                        "msg": '', //解析提示文本
                        "count": 0, //解析数据长度
                        "data": [] //解析数据列表
                    };
                }

            },
            //**************************异步请求结束***********************

            toolbar: '#toolbarDemo',
            defaultToolbar: ['filter', 'exports', 'print', {
                title: getLanguage('TimeGroup.t4'),
                layEvent: 'LAYTABLE_TIPS',
                icon: 'layui-icon-tips'
            }],
            cols: [
                [{
                        type: "checkbox",
                        width: 50
                    },
                    {
                        field: 'GroupNum',
                        width: 80,
                        title: getLanguage('TimeGroup.t5'),
                        sort: true
                    },
                    {
                        field: 'Week1',
                        title: getLanguage('TimeGroup.t6'),
                        sort: true,
                        templet: function (d) {
                            return formatTimegroup(d.Week1);
                        }
                    },
                    {
                        field: 'Week2',
                        title: getLanguage('TimeGroup.t7'),
                        sort: true,
                        templet: function (d) {
                            return formatTimegroup(d.Week2);
                        }
                    },
                    {
                        field: 'Week3',
                        title: getLanguage('TimeGroup.t8'),
                        sort: true,
                        templet: function (d) {
                            return formatTimegroup(d.Week3);
                        }
                    },
                    {
                        field: 'Week4',
                        title: getLanguage('TimeGroup.t9'),
                        sort: true,
                        templet: function (d) {
                            return formatTimegroup(d.Week4);
                        }
                    },
                    {
                        field: 'Week5',
                        title: getLanguage('TimeGroup.t10'),
                        sort: true,
                        templet: function (d) {
                            return formatTimegroup(d.Week5);
                        }
                    },
                    {
                        field: 'Week6',
                        title: getLanguage('TimeGroup.t11'),
                        sort: true,
                        templet: function (d) {
                            return formatTimegroup(d.Week6);
                        }
                    },
                    {
                        field: 'Week7',
                        title: getLanguage('TimeGroup.t12'),
                        sort: true,
                        templet: function (d) {
                            return formatTimegroup(d.Week7);
                        }
                    },
                    {
                        title: getLanguage('admin.a21'),
                        minWidth: 150,
                        toolbar: '#currentTableBar',
                        align: "center"
                    }
                ]
            ],
            limits: [100, 200, 300, 400, 500, 600],
            limit: 100,
            page: true,
            skin: 'line',
            done: function (res, curr, count) {
                setLanguage();
                setAllAttrVal()
            }
        });

        function formatTimegroup(d) {
            //debugger;
            return d.replace(/\/00:00-00:00/g, '').replace(/00:00-00:00/g, '');
        };

        function ReloadPage() {
            table.reload('timeGroupPageTable', {
                page: {
                    curr: 1
                }
            }, 'data');

            setLanguage();
            setAllAttrVal()
        }

        function EditTimeGroup(timegroupItem) {
            var content = miniPage.getHrefContent('page/TimeGroup/TimeGroupDetail.html');
            var openWH = miniPage.getOpenWidthHeight();
            faceAPI.TimeGroupEditPage = timegroupItem;
            faceAPI.TimeGroupEditPageResult = null;
            var index = layer.open({
                title: getLanguage('TimeGroup.addTimeGroup'),
                type: 1,
                shade: 0.2,
                maxmin: false,
                shadeClose: false,
                area: ['1050px', '700px'],
                content: content,
                end: function (layero, index) {

                    var rst = faceAPI.TimeGroupEditPageResult;
                    if (rst != null && rst.Result) {
                        ReloadPage();
                    };

                }
            });
        }

        /**
         * toolbar事件监听
         */
        table.on('toolbar(currentTableFilter)', function (obj) {
            if (obj.event === 'add') { // 监听添加操作
                EditTimeGroup(undefined);
            }else if (obj.event === 'reload') { // 监听刷新操作
                //执行搜索重载
                ReloadPage();
                
            } else if (obj.event === 'delete') { // 监听删除操作
                //执行删除操作
                var checkStatus = table.checkStatus('timeGroupPageTable'),
                    data = checkStatus.data;
                var groupNums = [];
                //console.log(data);
                data.forEach(function (item, index) {
                    if (item.GroupNum != 1)
                        groupNums.push(item.GroupNum);
                });
                if (groupNums.length == 0) {
                    layer.alert(getLanguage('TimeGroup.DeleteGroup'), {
                        icon: 2
                    });//请勾选需要删除的时段！
                    return;
                }
                deleteTimeGroup(groupNums);
                


            } else if (obj.event === 'btnRecover') { // 恢复默认值
                faceAPI.AjaxPOSTJson({
                    url: '/api/TimeGroup/SetDefault',
                    success: function (result) {
                        if (result.Result == false) {
                            layer.alert(result.Error, {
                                icon: 2
                            });
                        } else {
                            ReloadPage();
                        }
                    }
                });
            } else if (obj.event === 'TestData') { // 填充测试数据
                fullTestData();
            } 
            // debugger
            setLanguage();
            setAllAttrVal()

            return false;
        });

        function deleteTimeGroup(groupNums) {
            //操作确认： 删除开门时段？
            layer.confirm(getLanguage('TimeGroup.DeleteGroupTip'), { icon: 3 }, function (
                index) {
                layer.close(index);

                faceAPI.AjaxPOSTJson({
                    data: {
                        GroupNums: groupNums
                    },
                    url: '/api/TimeGroup/Delete',
                    success: function (result) {
                        if (result.Result == false) {
                            layer.alert(result.Error, {
                                icon: 2
                            });
                        } else {

                            ReloadPage();
                        }
                    }
                });

            });
        }

        function fullTestData(groupNums) {
            //填充测试数据需要清空已有时段，是否继续？
            layer.confirm(getLanguage('TimeGroup.TestDataTip'), { icon: 3 }, function (
                index) {
                layer.close(index);

                faceAPI.AjaxPOSTJson({
                    data: {
                        GroupNums: groupNums
                    },
                    url: '/api/TimeGroup/AddTestData',
                    success: function (result) {
                        if (result.Result == false) {
                            layer.alert(result.Error, {
                                icon: 2
                            });
                        } else {

                            ReloadPage();
                        }
                    }
                });

            });
        }

        table.on('tool(currentTableFilter)', function (obj) {
            var data = obj.data;
            if (obj.event === 'edit') {

                EditTimeGroup(data);

            } else if (obj.event === 'delete') {
                deleteTimeGroup([data.GroupNum]);
            }

            setLanguage();
            setAllAttrVal()

            return false;
        });
    });


    setTimeout(() => {
        setLanguage();
        setAllAttrVal()
    }, 100);
</script>
