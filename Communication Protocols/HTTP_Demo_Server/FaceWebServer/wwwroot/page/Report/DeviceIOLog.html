<div class="layuimini-container layuimini-page-anim" divname="DeviceLog">
    <div class="layuimini-main">

        <script type="text/html" id="toolbarDemo">
            <div class="layui-btn-container">
                <button class="layui-btn layui-btn-normal layui-btn-sm data-add-btn" lay-event="search">
                    <i class="layui-icon"></i> <span language='DeviceLog.d1' tt="查询"></span>
                </button>

                <button class="layui-btn layui-btn-sm" lay-event="refresh" language='DeviceLog.d2' tt="刷新">  </button>

                <button class="layui-btn layui-btn-sm layui-btn-danger data-delete-btn" lay-event="clear" language='DeviceLog.d3' tt="清空日志">
                </button>
            </div>
        </script>

        <table class="layui-hide" id="DeviceLogPage" lay-filter="DeviceLogPageTableFilter"></table>

        <script type="text/html" id="currentTableBar">
            <a class="layui-btn layui-btn-normal layui-btn-xs data-count-edit" lay-event="edit" language='DeviceLog.d4' tt="详情"></a>
        </script>
    </div>
</div>

<script>

    layui.use(['form', 'table', 'miniPage', 'element', 'faceAPI'], function () {
        var $ = layui.jquery,
            form = layui.form,
            table = layui.table,
            miniPage = layui.miniPage;
        var faceAPI = layui.faceAPI;
        form.render();

        IniSearchPar();

        table.render({
            elem: '#DeviceLogPage',
            //**************************异步请求开始***********************
            url: 'api/ConnectIOLog/GetLogs',
            method: 'post',
            contentType: 'application/json',
            where: faceAPI.DeviceLogSearchPageResult.field,
            headers: {
                Authorization: "Bearer " + faceAPI.GetJWTToken()
            }, //增加Token验证头
            request: {
                pageName: 'PageIndex', //页码的参数名称，默认：page
                limitName: 'PageSize' //每页数据量的参数名，默认：limit
            },
            parseData: function (res) { //res 即为原始返回的数据

                if (res.Result == true) {
                    var data = res.Content;
                    var ret = {
                        "code": res.ErrCode, //解析接口状态
                        "msg": res.Error, //解析提示文本
                        "count": data.TotalCount, //解析数据长度
                        "data": data.DataList //解析数据列表
                    };
                    return ret;

                } else {

                    return {
                        "code": 0, //解析接口状态
                        "msg": '', //解析提示文本
                        "count": 0, //解析数据长度
                        "data": [] //解析数据列表
                    };
                }

            },
            //**************************异步请求结束***********************

            toolbar: '#toolbarDemo',
            defaultToolbar: ['filter', 'exports', 'print', {
                title: getLanguage('DeviceLog.d5'),
                layEvent: 'LAYTABLE_TIPS',
                icon: 'layui-icon-tips'
            }],
            cols: [
                [{
                    field: 'LogTime',
                    width: 220,
                    title: getLanguage('DeviceLog.d6'),//时间
                    sort: true
                },
                {
                    field: 'SN',
                    width: 180,
                    title: getLanguage('DeviceLog.d7'),//SN
                    sort: true
                },
                {
                    field: 'IPAddr',
                    width: 200,
                    title: getLanguage('DeviceLog.d8'),//IP地址
                    sort: true
                },
                {
                    field: 'Protocol',
                    width: 150,
                    title: getLanguage('DeviceLog.Protocol'),//协议
                    sort: true
                },
                {
                    field: 'HttpType',
                    width: 120,
                    title: getLanguage('DeviceLog.d9'),//请求方向
                    sort: true
                },
                {
                    field: 'RequestID',
                    width: 190,
                    title: getLanguage('DeviceLog.d10'),
                    sort: true
                },
                {
                    field: 'APIName',
                    width: 200,
                    title: getLanguage('DeviceLog.APIName'),
                    sort: true,
                    templet: function (d) {
                        //console.log('DeviceLog.' + d.APIName);
                        return getLanguage('DeviceLog.' + d.APIName);
                    }
                },

                {
                    field: 'ContentLength',
                    width: 140,
                    title: getLanguage('DeviceLog.d12'),
                    sort: true
                },
                {
                    field: 'URL',
                    title: getLanguage('DeviceLog.d11'),
                    sort: true
                },
                {
                    title: getLanguage('DeviceLog.d13'),
                    width: 80,
                    toolbar: '#currentTableBar',
                    align: "center"
                }
                ]
            ],
            limits: [100, 200, 300, 400, 500, 600],
            limit: 100,
            page: true,
            skin: 'line',
            done: function (res, curr, count) {
                
                setLanguage();
                setAllAttrVal();
            }
        });





        /**
         * toolbar事件监听
         */
        table.on('toolbar(DeviceLogPageTableFilter)', function (obj) {
            if (obj.event === 'search') { // 查询操作
                var content = miniPage.getHrefContent('page/Report/DeviceIOLogSearch.html');
                var openWH = miniPage.getOpenWidthHeight();

                var index = layer.open({
                    title: getLanguage('DeviceLog.d14'),
                    type: 1,
                    shade: 0.2,
                    maxmin: false,
                    shadeClose: false,
                    area: ['700px', '600px'],
                    content: content,
                    end: function (layero, index) {

                        var rst = faceAPI.DeviceLogSearchPageResult;
                        if (rst != null && rst.result) {
                            refreshTable(false);

                        };

                    }
                });
            } else if (obj.event == 'refresh') {
                //执行搜索重载
                refreshTable(true);
            } else if (obj.event == 'clear') {
                layer.confirm(getLanguage('DeviceLog.d15'), { icon: 3 }, function (index) {
                    var loadindex = layer.load(1, { shade: [0.6, '#e2e2e2'] });
                    faceAPI.AjaxPOSTJson({
                        url: '/api/ConnectIOLog/DeleteLogs',
                        timeout: 9999999,
                        success: function (result) {
                            layer.close(loadindex);
                            if (result.Result == false) {
                                layer.alert(result.Error, {
                                    icon: 2
                                });
                            } else {
                                refreshTable(true);
                            }

                        }
                    });


                    layer.close(index);
                });


            }
        });

        function refreshTable(bIni) {
            if (bIni) IniSearchPar();
            var rst = faceAPI.DeviceLogSearchPageResult;
            table.reload('DeviceLogPage', {
                page: {
                    curr: 1
                },
                where: rst.field
            }, 'data');
            setLanguage();
            setAllAttrVal()
        }

        function IniSearchPar() {
            var par = {
                field: {
                    QueryBeginTime: dayjs().subtract(7, 'day').format("YYYY-MM-DD") + ' 00:00:00',
                    QueryEndTime: dayjs().format("YYYY-MM-DD") + ' 23:59:59',
                    SN: null,
                    Protocol: null,
                    APIName: null,
                    NotAPIName: null,
                    HttpType: null,
                },
                result: true
            };

            faceAPI.DeviceLogSearchPageResult = par;
        }

        table.on('tool(DeviceLogPageTableFilter)', function (obj) {
            var data = obj.data;

            if (obj.event === 'edit') {

                var content = miniPage.getHrefContent('page/Report/DeviceIOLogDetail.html');
                var openWH = miniPage.getOpenWidthHeight();
                faceAPI.DeviceLogDetail = data; //向layer页面传值，传值主要代码
                var index = layer.open({
                    title: getLanguage('DeviceLog.d16'),
                    type: 1,
                    shade: 0.2,
                    maxmin: true,
                    shadeClose: true,
                    area: [openWH[0] + 'px', openWH[1] + 'px'],
                    offset: [openWH[2] + 'px', openWH[3] + 'px'],
                    content: content,
                });
                $(window).on("resize", function () {
                    layer.full(index);
                });
                return false;
            }
        });



    });

    setTimeout(() => {
        setLanguage();
        setAllAttrVal()
    }, 100);
</script>
