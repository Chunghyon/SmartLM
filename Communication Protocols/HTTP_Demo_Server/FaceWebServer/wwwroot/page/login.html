<body>
    <div class="layui-container">
        <div class="admin-login-background">
            <div class="layui-form login-form">
                <form class="layui-form" action="">
                    <div class="layui-form-item logo-title">
                        <h1 language="Login.h1">人脸机管理系统</h1>
                        <h1 language="Login.login">登录</h1>
                    </div>
                    <div class="layui-form-item">
                        <label class="layui-icon layui-icon-username" for="username"></label>
                        <input id="Login.l1" data-lang='placeholder' type="text" name="username" lay-verify="required|account" placeholder="用户名或者邮箱"
                            autocomplete="off" class="layui-input" value="">
                    </div>
                    <div class="layui-form-item">
                        <label class="layui-icon layui-icon-password" for="password"></label>
                        <input id="Login.l2" data-lang='placeholder' type="password" name="password" lay-verify="required|password" placeholder="密码"
                            autocomplete="off" class="layui-input" value="">
                    </div>
                   
                    <div class="layui-form-item">
                        <input type="checkbox" id="rememberMe"  name="rememberMe" value="true" lay-skin="primary"><span style="color: #666;position: absolute;top: 10px;" language='Login.l4'>记住密码</span>
                    </div>
                    <div class="layui-form-item">
                        <button class="layui-btn layui-btn layui-btn-normal layui-btn-fluid" lay-submit=""
                            lay-filter="login">
                            <span language='Login.h2'>登 入</span>
                        </button>
                    </div>
                </form>
                <div class="langSet">
                    
                    <ul class="layui-nav layui-layout-right languageChange" style="z-index:9999">
                        
                        <img style="width:20px;height: 20px;" src="../images/language.png" alt="" srcset="">
                        <li class="layui-nav-item" lay-unselect>
                            <a href="javascript:;">
                                <cite id="languageStatus">中文</cite>
                            </a>
                            <dl class="layui-nav-child">
                                <dd onclick="changeLanguage('cn')"><a>中文</a></dd>
                                <dd onclick="changeLanguage('en')"><a>Englist</a></dd>
                            </dl>
                        </li>
                    </ul>
                </div>
            </div>
        </div>
    </div>

    <script src="../lib/jquery-3.4.1/jquery-3.4.1.min.js" charset="utf-8"></script>
    <script src="../lib/layui-v2.6.8/layui.js" charset="utf-8"></script>
    <script src="../lib/jq-module/jquery.particleground.min.js" charset="utf-8"></script>
    <script src="../js/lay-config.js?v=2.0.0" charset="utf-8"></script>
    <script>
        layui.use(['form', 'jquery', 'layer', 'faceAPI'], function () {
            var $ = layui.jquery, form = layui.form,
                layer = layui.layer;

            // 登录过期的时候，跳出ifram框架
            if (top.location != self.location) top.location = self.location;

            // 粒子线条背景
            $(document).ready(function () {
                $('.layui-container').particleground({
                    dotColor: '#7ec7fd',
                    lineColor: '#7ec7fd'
                });
            });
            
            let login = localStorage.getItem('login')||null;
            console.log('[ login ] >', login)
            if(login){
                login= JSON.parse(login);
                console.log('[ login ] >', login)
                $('#rememberMe').attr("checked", login.checked);
                

                form.render("checkbox")
                console.log('[  ] >', $('#Login.l1'))
                document.getElementById('Login.l1').value=login.password;
                document.getElementById('Login.l2').value=login.username;
                
            }
            
            // 进行登录操作
            
            form.on('submit(login)', function (data) {
                data = data.field;
                
                
                if (data.username == '') {
                    layer.msg(getLanguage('Login.l5'));
                    return false;
                }
                if (data.password == '') {
                    layer.msg(getLanguage('Login.l6'));
                    return false;
                }
                if($('#rememberMe').prop("checked")){
                    localStorage.setItem('login',JSON.stringify({
                        checked:true,
                        username:data.username,
                        password:data.password
                    }))
                }else{
                    localStorage.removeItem('login')
                }
                //检查是否已登录，未登录则跳转登陆页面
                $.ajax({
                    type: 'Post',
                    data: data,
                    url: '/api/User/Login',
                    success: function (result) {
                        if (result.Result == false) {
                            var errMsgs = [];
                            errMsgs[1] = getLanguage('Login.l8')//"用户名不存在！";
                            errMsgs[2] = getLanguage('Login.l9')//"用户密码输入错误！";
                            errMsgs[3] = getLanguage('Login.l13')//"验证码已过期！";
                            errMsgs[4] = getLanguage('Login.l10')//"请输入验证码！";
                            errMsgs[5] = getLanguage('Login.l11')//"验证码不正确！";
                            if (result.ErrCode <= 5) {
                                layer.alert(errMsgs[result.ErrCode], { icon: 2 });
                            }
                            else {
                                layer.alert(result.Error, { icon: 2 });
                            }
                        }
                        else {
                            layui.faceAPI.SaveJWTToken(result.Content);
                            layer.msg(getLanguage('Login.l12'), function () {
                                window.location = '../index.html';
                            });
                        }

                    }
                });

                return false;
            });

        });
    </script>
</body>
