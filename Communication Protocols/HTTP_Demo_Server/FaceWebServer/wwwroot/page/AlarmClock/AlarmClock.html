<div class="layuimini-container layuimini-page-anim" divname="admin">
    <div class="layuimini-main">

        <script type="text/html" id="toolbarDemo">
            <div class="layui-btn-container">
                <button class="layui-btn layui-btn-normal layui-btn-sm data-add-btn" lay-event="add">
                    <span language="people.p2" t="添加"></span>
                </button>
                <button class="layui-btn layui-btn-sm layui-btn-danger data-delete-btn" lay-event="delete">
                    <span language="people.p3" t="删除"></span>
                </button>
                <button class="layui-btn layui-btn-normal layui-btn-sm" lay-event="reload" language='TimeGroup.t1' tt="刷新"> </button>
                <button class="layui-btn layui-btn-sm layui-btn-danger data-delete-btn" lay-event="DeleteAll" language='AlarmClock.Clear' tt="删除所有"></button>
                <!--<button class="layui-btn layui-btn-normal layui-btn-sm data-add-btn" lay-event="TestData" language='AlarmClock.TestData' tt="填充测试数据"></button>-->
            </div>
        </script>

        <table class="layui-hide" id="AlarmClockTable" lay-filter="AlarmClockTableFilter"></table>

        <script type="text/html" id="currentTableBar">
            <a class="layui-btn layui-btn-normal layui-btn-xs data-count-edit" lay-event="edit">
                <span language="people.p7">编辑</span>
            </a>
            <a class="layui-btn layui-btn-xs layui-btn-danger data-count-delete" lay-event="delete">
                <span language="people.p8">删除</span>
            </a>
        </script>

    </div>
</div>

<script>
    layui.use(['table', 'miniPage', 'faceAPI'], function () {
        var $ = layui.jquery,
            table = layui.table,
            miniPage = layui.miniPage;
        var faceAPI = layui.faceAPI;
        var openWH = miniPage.getOpenWidthHeight();
        var tableId = "AlarmClockTable";
        table.render({
            elem: '#AlarmClockTable',
            url: 'api/AlarmClock/Query',
            contentType: "application/json",
            method: 'post',
            headers: {
                Authorization: "Bearer " + faceAPI.GetJWTToken()
            }, //增加Token验证头
            request: {
                pageName: 'PageIndex', //页码的参数名称，默认：page
                limitName: 'PageSize' //每页数据量的参数名，默认：limit
            },
            parseData: function (res) { //res 即为原始返回的数据
                if (res.ErrCode == 0) {
                    var data = res.Content;
                    var ret = {
                        "code": res.ErrCode, //解析接口状态
                        "msg": res.Error, //解析提示文本
                        "count": data.TotalCount, //解析数据长度
                        "data": data.DataList //解析数据列表
                    };
                    return ret;

                } else {
                    /*layer.open({
                        title: '请求错误',
                        content: '(' + res.ErrCode + ')' + res.Error
                    });  */

                    return {
                        "code": 0, //解析接口状态
                        "msg": '', //解析提示文本
                        "count": 0, //解析数据长度
                        "data": [] //解析数据列表
                    };
                }

            },

            toolbar: '#toolbarDemo',
            defaultToolbar: ['filter', 'exports', 'print'],
            limits: [50, 100, 200],
            limit: 50,
            height: openWH[1] - 60,
            skin: 'line',
            cols: [[
                { type: 'checkbox' },
                { field: 'Num', width: 140, title: getLanguage('AlarmClock.AlarmClocks_Num'), sort: true },
                {
                    field: 'Date', title: getLanguage('AlarmClock.AlarmClocks_Clock'), sort: true,
                    templet: function (d) {
                        //2024-04-01
                        return d.Date.slice(11, 16);
                    }
                },
                {
                    field: 'Times',
                    title: getLanguage('AlarmClock.AlarmClocks_Times'),
                    sort: true
                },
                { fixed: 'right', title: getLanguage('people.p18'), toolbar: '#currentTableBar', width: 180 }]],
            done: function (res, curr, count) {
                setLanguage();
                setAllAttrVal()
            }

        });


        function ReloadPage() {
            table.reload(tableId, {
                page: {
                    curr: 1
                }
            }, 'data');

            setLanguage();
            setAllAttrVal()
        }

        /**
         *工具栏点击事件
         */
        table.on('toolbar(AlarmClockTableFilter)', function (obj) {
            if (obj.event == "add") {
                editAlarmClock();
            } else if (obj.event === 'reload') { // 监听刷新操作
                ReloadPage();

            } else if (obj.event == "delete") {

                var checkStatus = table.checkStatus('AlarmClockTable'),
                    data = checkStatus.data;

                var nums = [];
                //console.log(data);
                data.forEach(function (item, index) {
                    nums.push(item.Num);
                });
                if (data.length == 0) {
                    //请选择需要删除的数据！
                    layer.alert(getLanguage('AlarmClock.DeleteErrTip'), { icon: 2 });
                    return;
                }

                delteAlarmClock(nums);

            } else if (obj.event == "DeleteAll") {

                delteAllAlarmClock();

            } else if (obj.event == "TestData") {

                fullTestData();

            }
            return false;
        });
        /**
        *数据行点击事件
        */
        table.on('tool(AlarmClockTableFilter)', function (obj) {
            if (obj.event == "edit") {
                editAlarmClock(obj.data);

            } else if (obj.event == "delete") {
                delteAlarmClock([obj.data.Num]);

            }

            return false;
        });

        function editAlarmClock(data) {
            var content = miniPage.getHrefContent('page/AlarmClock/AlarmClockDetail.html');

            var title = getLanguage('AlarmClock.AddNewPage');//新增闹铃

            if (data !== undefined) {
                title = getLanguage('AlarmClock.EditPage');//修改闹铃
            }

            //向layer页面传值，传值主要代码
            faceAPI.AlarmClockEditPage = data;
            faceAPI.AlarmClockEditPageResult = false;

            var index = layer.open({
                title: title,
                type: 1,
                shade: 0.2,
                maxmin: false,
                shadeClose: false,
                area: ['400px', '350px'],
                content: content,
                end: function (layero, index) {
                    
                    if (faceAPI.AlarmClockEditPageResult == true) {
                        ReloadPage();
                    }
                }
            });
        }

        function delteAlarmClock(nums) {
            //确定删除选中的数据吗？
            layer.confirm(getLanguage('AlarmClock.DeleteTip'), { icon: 3 }, function (
                index) {
                layer.close(index);

                faceAPI.AjaxPOSTJson({
                    data: {
                        Nums: nums
                    },
                    url: '/api/AlarmClock/Delete',
                    success: function (result) {
                        if (result.Result == false) {
                            layer.alert(result.Error, {
                                icon: 2
                            });
                        } else {

                            ReloadPage();
                        }
                    }
                });

            });

        }

        function delteAllAlarmClock() {
            //是否确认清空闹铃？
            layer.confirm(getLanguage('AlarmClock.ClearTip'), { icon: 3 }, function (
                index) {
                layer.close(index);

                faceAPI.AjaxPOSTJson({
                    url: '/api/AlarmClock/DeleteAll',
                    success: function (result) {
                        if (result.Result == false) {
                            layer.alert(result.Error, {
                                icon: 2
                            });
                        } else {

                            ReloadPage();
                        }
                    }
                });

            });

        }

        function fullTestData() {
            //填充测试数据需要清空现有数据，是否继续？
            layer.confirm(getLanguage('AlarmClock.TestDataTip'), { icon: 3 }, function (
                index) {
                layer.close(index);

                faceAPI.AjaxPOSTJson({
                    url: '/api/AlarmClock/AddTestData',
                    success: function (result) {
                        if (result.Result == false) {
                            layer.alert(result.Error, {
                                icon: 2
                            });
                        } else {

                            ReloadPage();
                        }
                    }
                });

            });
        }
    });
    setTimeout(() => {
        setLanguage();
        setAllAttrVal()
    }, 100);
</script>
