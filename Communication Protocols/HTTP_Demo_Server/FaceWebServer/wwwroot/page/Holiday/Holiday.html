<div class="layuimini-container layuimini-page-anim" divname="admin">
    <div class="layuimini-main">

        <script type="text/html" id="toolbarDemo">
            <div class="layui-btn-container">
                <button class="layui-btn layui-btn-normal layui-btn-sm data-add-btn" lay-event="add">
                    <span language="people.p2" t="添加"></span>
                </button>
                <button class="layui-btn layui-btn-sm layui-btn-danger data-delete-btn" lay-event="delete">
                    <span language="people.p3" t="删除"></span>
                </button>
                <button class="layui-btn layui-btn-normal layui-btn-sm" lay-event="reload" language='TimeGroup.t1' tt="刷新"> </button>
                <button class="layui-btn layui-btn-sm layui-btn-danger data-delete-btn" lay-event="DeleteAll" language='Holiday.Clear' tt="删除所有"></button>
                <!--<button class="layui-btn layui-btn-normal layui-btn-sm data-add-btn" lay-event="TestData" language='Holiday.TestData' tt="填充测试数据"></button>-->
            </div>
        </script>

        <table class="layui-hide" id="HolidayTable" lay-filter="HolidayTableFilter"></table>

        <script type="text/html" id="currentTableBar">
            <a class="layui-btn layui-btn-normal layui-btn-xs data-count-edit" lay-event="edit">
                <span language="people.p7">编辑</span>
            </a>
            <a class="layui-btn layui-btn-xs layui-btn-danger data-count-delete" lay-event="delete">
                <span language="people.p8">删除</span>
            </a>
        </script>

    </div>
</div>

<script>
    layui.use(['table', 'miniPage', 'faceAPI'], function () {
        var $ = layui.jquery,
            table = layui.table,
            miniPage = layui.miniPage;
        var faceAPI = layui.faceAPI;
        var openWH = miniPage.getOpenWidthHeight();
        var tableId = "HolidayTable";
        table.render({
            elem: '#HolidayTable',
            url: 'api/Holiday/Query',
            contentType: "application/json",
            method: 'post',
            headers: {
                Authorization: "Bearer " + faceAPI.GetJWTToken()
            }, //增加Token验证头
            request: {
                pageName: 'PageIndex', //页码的参数名称，默认：page
                limitName: 'PageSize' //每页数据量的参数名，默认：limit
            },
            parseData: function (res) { //res 即为原始返回的数据
                if (res.ErrCode == 0) {
                    var data = res.Content;
                    var ret = {
                        "code": res.ErrCode, //解析接口状态
                        "msg": res.Error, //解析提示文本
                        "count": data.TotalCount, //解析数据长度
                        "data": data.DataList //解析数据列表
                    };
                    return ret;

                } else {
                    /*layer.open({
                        title: '请求错误',
                        content: '(' + res.ErrCode + ')' + res.Error
                    });  */

                    return {
                        "code": 0, //解析接口状态
                        "msg": '', //解析提示文本
                        "count": 0, //解析数据长度
                        "data": [] //解析数据列表
                    };
                }

            },

            toolbar: '#toolbarDemo',
            defaultToolbar: ['filter', 'exports', 'print'],
            limits: [50, 100, 200],
            limit: 50,
            height: openWH[1] - 60,
            skin: 'line',
            cols: [[
                { type: 'checkbox' },
                { field: 'Num', width: 140, title: getLanguage('Holiday.h1'), sort: true },
                { field: 'Date', title: getLanguage('Holiday.h2'), sort: true },
                { field: 'ht', title: getLanguage('Holiday.h3'), sort: true, templet: getHt },
                { field: 'cycle', title: getLanguage('Holiday.h4'), sort: true, templet: getCycle },
                { fixed: 'right', title: getLanguage('people.p18'), toolbar: '#currentTableBar', width: 180 }]],
            done: function (res, curr, count) {
                setLanguage();
                setAllAttrVal()
            }

        });


        function ReloadPage() {
            table.reload(tableId, {
                page: {
                    curr: 1
                }
            }, 'data');

            setLanguage();
            setAllAttrVal()
        }


        /**
         *节假日管控范围类型
         */
        function getHt(data) {
            //节假日管控范围，1--全天；2--上午 00:00-12:00;  3--下午(12:00-23:59),默认值为1；
            if (data.HolidayType == 3) {
                return getLanguage('Holiday.h5');
            }
            if (data.HolidayType == 2) {
                return getLanguage('Holiday.h6');
            }
            return getLanguage('Holiday.h7');
        }
        /**
        * 是否每年循环
        */
        function getCycle(data) {
            //是否每年循环，1--每年循环；0--不循环；默认值为0；
            if (data.Cycle == 1) {
                return getLanguage('Holiday.h8');
            }
            return getLanguage('Holiday.h9');
        }


        /**
         *工具栏点击事件
         */
        table.on('toolbar(HolidayTableFilter)', function (obj) {
            if (obj.event == "add") {
                editHoliday();
            } else if (obj.event === 'reload') { // 监听刷新操作
                ReloadPage();

            } else if (obj.event == "delete") {

                var checkStatus = table.checkStatus('HolidayTable'),
                    data = checkStatus.data;

                var nums = [];
                //console.log(data);
                data.forEach(function (item, index) {
                    nums.push(item.Num);
                });
                if (data.length == 0) {
                    layer.alert(getLanguage('Holiday.h10'), { icon: 2 });
                    return;
                }

                delteHoliday(nums);

            } else if (obj.event == "DeleteAll") {

                delteAllHoliday();

            } else if (obj.event == "TestData") {

                fullTestData();

            }
            return false;
        });
        /**
        *数据行点击事件
        */
        table.on('tool(HolidayTableFilter)', function (obj) {
            if (obj.event == "edit") {
                editHoliday(obj.data);

            } else if (obj.event == "delete") {
                delteHoliday([obj.data.Num]);

            }

            return false;
        });

        function editHoliday(data) {
            var content = miniPage.getHrefContent('page/Holiday/HolidayEdit.html');

            var title = getLanguage('Holiday.h12');//新增节假日

            if (data !== undefined) {
                title = getLanguage('Holiday.h13');//修改节假日
            }

            //向layer页面传值，传值主要代码
            faceAPI.HolidayEditPage = data;
            faceAPI.HolidayEditPageResult = false;

            var index = layer.open({
                title: title,
                type: 1,
                shade: 0.2,
                maxmin: false,
                shadeClose: false,
                area: ['400px', '350px'],
                content: content,
                end: function (layero, index) {

                    if (faceAPI.HolidayEditPageResult == true) {
                        ReloadPage
                    }
                }
            });
        }

        function delteHoliday(nums) {
            layer.confirm(getLanguage('Holiday.h11'), { icon: 3 }, function (
                index) {
                layer.close(index);

                faceAPI.AjaxPOSTJson({
                    data: {
                        Nums: nums
                    },
                    url: '/api/Holiday/Delete',
                    success: function (result) {
                        if (result.Result == false) {
                            layer.alert(result.Error, {
                                icon: 2
                            });
                        } else {

                            ReloadPage();
                        }
                    }
                });

            });

        }

        function delteAllHoliday() {
            //是否确认清空节假日？
            layer.confirm(getLanguage('Holiday.ClearTip'), { icon: 3 }, function (
                index) {
                layer.close(index);

                faceAPI.AjaxPOSTJson({
                    url: '/api/Holiday/DeleteAll',
                    success: function (result) {
                        if (result.Result == false) {
                            layer.alert(result.Error, {
                                icon: 2
                            });
                        } else {

                            ReloadPage();
                        }
                    }
                });

            });

        }

        function fullTestData() {
            //是否确认清空节假日？
            layer.confirm(getLanguage('Holiday.ClearTip'), { icon: 3 }, function (index) {
                layer.close(index);

                faceAPI.AjaxPOSTJson({
                    url: '/api/Holiday/AddTestData',
                    success: function (result) {
                        if (result.Result == false) {
                            layer.alert(result.Error, {
                                icon: 2
                            });
                        } else {

                            ReloadPage();
                        }
                    }
                });

            });
        }
    });
    setTimeout(() => {
        setLanguage();
        setAllAttrVal()
    }, 100);
</script>
