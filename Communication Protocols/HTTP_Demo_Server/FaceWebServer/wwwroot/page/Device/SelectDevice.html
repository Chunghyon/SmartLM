<div class="layuimini-main" id="device-select-div">


    <form class="layui-form" style="margin: 0 auto;max-width: 800px;">
        <div>
            <table class="layui-hide" id="SelectDeviceTable"
                   lay-filter="SelectDeviceTableFilter"></table>
        </div>
        <div class="layui-panel defcenter">
            <button class="layui-btn" lay-submit lay-filter="btnSelectDoor"
                    language='people.BtnSelect'>
                选择
            </button>
        </div>
    </form>

</div>

<script>
    setLanguage();
    setAllAttrVal()

    layui.use(['form', 'laydate', 'miniPage', 'table', 'faceAPI', 'step', 'slider'], function () {
        var form = layui.form,
            layer = layui.layer,
            table = layui.table,
            step = layui.step,
            $ = layui.$;



        var slider = layui.slider;
        var faceAPI = layui.faceAPI;
        var laydate = layui.laydate;
        var miniPage = layui.miniPage;

        

        // 当前弹出层，防止ID被覆盖
        var parentIndex = layer.index;

        faceAPI.SelectDevicePageResult = null;

        form.on('submit(btnSelectDoor)', function (data) {
            var checkStatus = table.checkStatus('SelectDeviceTable')
                , data = checkStatus.data;
            if (data.length != 1) {
                layer.open({
                    title: getLanguage('access.a100'),//提示
                    content: getLanguage('access.selectDeviceTooMuch'),//请勾选一个设备
                    icon: 2
                });
                return false;
            }
            faceAPI.SelectDevicePageResult = data[0];
            layer.close(parentIndex);
            return false;
        });



        //加载门列表
        table.render({
            height: 450,
            elem: '#SelectDeviceTable',
            //**************************异步请求开始***********************
            url: 'api/Device/Query',
            method: 'post',
            contentType: "application/json",
            headers: {
                Authorization: "Bearer " + faceAPI.GetJWTToken()
            },//增加Token验证头
            request: {
                pageName: 'PageIndex', //页码的参数名称，默认：page
                limitName: 'PageSize' //每页数据量的参数名，默认：limit
            },
            where: {
                IsOnline: 1
            },
            parseData: function (res) { //res 即为原始返回的数据
                if (res.ErrCode == 0) {
                    var data = res.Content;
                    var ret = {
                        "code": res.ErrCode, //解析接口状态
                        "msg": res.Error, //解析提示文本
                        "count": data.TotalCount, //解析数据长度
                        "data": data.DataList //解析数据列表
                    };
                    return ret;

                } else {
                    return {
                        "code": 0, //解析接口状态
                        "msg": '', //解析提示文本
                        "count": 0, //解析数据长度
                        "data": [] //解析数据列表
                    };
                }
            },
            cols: [[
                { type: "checkbox", width: 40 },
                { field: 'SN', width: 160, title: 'SN', sort: true },
                { field: 'DeviceName', width: 200, title: getLanguage('device.d13'), sort: true },//名称
                { field: 'Protocol', width: 100, title: getLanguage('device.Protocol'), sort: true },//协议类型
                { field: 'DeviceVer', width: 100, title: getLanguage('device.d14') },
                {//出入类型 0,入门；1，出门
                    field: 'IsEntry', width: 110, title: getLanguage('device.d15'),
                    templet: function (d) {
                        if (d.IsEntry == 0) return getLanguage('device.d16');//入门
                        return getLanguage('device.d17');//出门
                    }
                },
            ]],
            limits: [100, 200, 500, 1000],
            limit: 100,
            page: true,
            skin: 'line'
        });
    });



</script>
