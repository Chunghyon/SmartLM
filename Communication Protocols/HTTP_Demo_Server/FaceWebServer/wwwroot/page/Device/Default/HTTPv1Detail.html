                                               tipMsg="服务器地址，最长100个字符，必填<br/>示例：http://192.168.1.86:4610/FaceAPI">

                                               autocomplete="off" class="layui-input" lay-verify="required"

                                               placeholder="请输入保活包发包间隔" lay-reqText="请输入保活包发包间隔" tipShow="1"

                        <div style="margin: 3px 3px 3px 3px">
                            <div class="layui-form-item">

                                <div class="layui-inline ">
                                    <label class="layui-form-label" language='device.d186'> 存储陌生人记录</label>
                                    <div class="layui-input-inline">
                                        <input type="checkbox" name="ParameterSaveExternalvisitors" lay-skin="switch"
                                               id="device.d187" data-lang="lay-text"
                                               lay-text="启用|禁用" unchecked value="1">

                                <div class="layui-inline">
                                    <label class="layui-form-label" language='device.d188'> 保存现场图片</label>
                                    <div class="layui-input-inline">

    <div class="layui-panel" style="text-align: center;" id="device_update_button_div">
        <style>
            #device_update_button_div button {
                width: 150px;
            }
        </style>
        <div style="margin: 5px 5px 5px 5px">
            <!-- 按钮 -->
            <div class="layui-form-item">
                <div class="layui-inline">
                    <button type="submit" class="layui-btn layui-btn-normal"
                            lay-submit lay-filter="data-save-btn" language='device.d224'>
                        <i class="layui-icon"></i> 保存
                    </button>
                </div>
                <div class="layui-inline">
                    <button type="submit" class="layui-btn layui-btn-danger"
                            id="data-cancel-btn" language='device.d225'>
                        <i class="layui-icon"></i> 取消
                    </button>
                </div>
            </div>
        </div>

<script>
    setLanguage();
    setAllAttrVal()
    //注意：选项卡 依赖 element 模块，否则无法进行功能性操作
    layui.use(['form', 'laydate', 'element', 'faceAPI'], function () {
        var element = layui.element;
        var form = layui.form;
        var laydate = layui.laydate, $ = layui.$;;
        form.render();

        var serverDeviceDetail = {}; //服务器中的设备信息
        var currentDevice = {};//当前设备信息

        // 当前弹出层，防止ID被覆盖
        var parentIndex = layer.index;


        var faceAPI = layui.faceAPI;

        if (faceAPI.hasOwnProperty['DeviceDefaultPageType'] == false) {
            layer.close(parentIndex);
            return;
        }

        if (faceAPI.DeviceDefaultPageType == null) {
            layer.close(parentIndex);
            return;
        }
        //执行一个laydate实例
        laydate.render({
            elem: '[name="ParameterProductionDate"]', //指定元素
            type: 'date',
            format: 'yyyy-MM-dd'
        });

        

        //获取设备详情
        var iWaitIndex = layer.load(2);
        function GetDeviceDetail() {
            var sType = faceAPI.DeviceDefaultPageType;
            faceAPI.AjaxPOSTJson({
                url: '/api/Device/GetDefaultValue/' + sType,
                success: function (result) {
                    layer.close(iWaitIndex)
                    if (result.Result == false) {
                        layer.alert(result.error, { icon: 2 });
                        layer.close(parentIndex)
                    }
                    else {
                        //console.log(result.Content);
                        serverDeviceDetail = result.Content;
                        currentDevice = JSON.parse(serverDeviceDetail);
                        //console.log(device);
                        DeviceDetailBindFrom(currentDevice);
                    }
                }
            });
        }
        GetDeviceDetail();

        function DeviceDetailBindFrom(device) {

            if (device.ParameterProductionDate == "") {
                device.ParameterProductionDate = dayjs().format("YYYY-MM-DD");
            }
            
            //开始绑定字段值
            form.val("device_Update_div_filter", device);

            //绑定网络参数字段
            var _page4 = $('#device_Update_Page4');
            _page4.find('div[autoset]').each((ind, em) => {
                var _em = $(em);
                var name = _em.attr("name");
                if (device.hasOwnProperty(name))
                    _em.html(device[name]);
            });

            var SwitchTitle = [];
            SwitchTitle[0] = `${getLanguage('device.d226')}`;
            SwitchTitle[1] = `${getLanguage('device.d227')}`;

            _page4.find('div[name=ParameterNetworkSwitch]').html(SwitchTitle[device.ParameterNetworkSwitch]);
            _page4.find('div[name=ParameterNetworkIpActive]').html(SwitchTitle[device.ParameterNetworkIpActive]);
            _page4.find('div[name=ParameterWifiSwitch]').html(SwitchTitle[device.ParameterWifiSwitch]);



            //绑定状态字段
            var _page6 = $('#device_Update_Page6');
            _page6.find('div[name=CreateTime]').html(device.CreateTime);
            _page6.find('div[name=LastUpdatetime]').html(device.LastUpdatetime);

            var UploadStatusTitle = [];
            UploadStatusTitle[0] = `<span class="status-magenta">${getLanguage('device.d228')}</span>`;
            UploadStatusTitle[1] = `<span class="status-blue">${getLanguage('device.d229')}</span>`;

            var DoorStatusTitle = [];//门状态  0--无门磁；1--门开；2--门关
            DoorStatusTitle[0] = `<span>${getLanguage('device.d230')}</span>`;
            DoorStatusTitle[1] = `<span class="status-blue">${getLanguage('device.d231')}</span>`;
            DoorStatusTitle[2] = `<span class="status-MediumSeaGreen">${getLanguage('device.d232')}</span>`;

            var alarmStatusTitle = [];//设备报警状态  0--无报警；1--消防报警；2--门磁报警；3--开门超时报警；4--黑名单报警
            alarmStatusTitle[0] = `<span>${getLanguage('device.d233')}</span>`;
            alarmStatusTitle[1] = `<span class="status-red">${getLanguage('device.d234')}</span>`;
            alarmStatusTitle[2] = `<span class="status-red">${getLanguage('device.d235')}</span>`;
            alarmStatusTitle[3] = `<span class="status-Tomato">${getLanguage('device.d236')}</span>`;
            alarmStatusTitle[4] = `<span class="status-darkred">${getLanguage('device.d237')}</span>`;

            ShowOnlineStatus(device);

            //显示在线状态
            function ShowOnlineStatus(status) {
                _page6.find('div[isStaus]').each((ind, em) => $(em).html(status[$(em).attr("name")]));


                var onlineTime = dayjs(status.onlineTime, "YYYY-MM-DD HH:mm:ss");
                second = dayjs().diff(onlineTime, 'second');
                if (second < 30) {
                    _page6.find('div[name=onlineStatus]').html(`<span class="label label_online">${getLanguage('device.d238')}</span>`);

                    _page6.find('div[name=DoorStatus]').html(DoorStatusTitle[status.DoorStatus]);
                    _page6.find('div[name=alarmStatus]').html(alarmStatusTitle[status.alarmStatus]);

                }
                else {
                    _page6.find('div[name=onlineStatus]').html(`<span class="label label_offline">${getLanguage('device.d239')}</span>`);
                    _page6.find('div[name=DoorStatus]').html("");
                    _page6.find('div[name=alarmStatus]').html("");
                }



                _page6.find('div[name=UploadStatus]').html(UploadStatusTitle[status.UploadStatus]);
                if (status.UploadStatus == 0)
                    _page6.find('div[name=UploadStatusTime]').html("");

            }

            setLanguage();
            setAllAttrVal();
        }




        //监听测试
        $('#data-cancel-btn').on('click', function () {
            layer.close(parentIndex);
        });




        //监听提交
        form.on('submit(data-save-btn)', function (data) {

            var postdata = data.field;

            postdata.ParameterSystemTime = currentDevice.ParameterSystemTime;
            postdata.Timegroups = currentDevice.Timegroups;

            postdata.ParameterNetworkSwitch = currentDevice.ParameterNetworkSwitch;
            postdata.ParameterNetworkIpActive = currentDevice.ParameterNetworkIpActive;
            postdata.ParameterNetworkIpUrl = currentDevice.ParameterNetworkIpUrl;
            postdata.ParameterNetworkSubnetMask = currentDevice.ParameterNetworkSubnetMask;
            postdata.ParameterNetworkGteway = currentDevice.ParameterNetworkGteway;
            postdata.ParameterNetworkDns = currentDevice.ParameterNetworkDns;
            postdata.ParameterWifiSwitch = currentDevice.ParameterWifiSwitch;
            postdata.ParameterWifiName = currentDevice.ParameterWifiName;
            postdata.ParameterWifiPassWord = currentDevice.ParameterWifiPassWord;
            



            postdata.ParameterVolume = Number(postdata.ParameterVolume);
            postdata.ParameterVoiceMode = Number(postdata.ParameterVoiceMode);
            postdata.ParameterGrettings = Number(postdata.ParameterGrettings);
            postdata.ParameterStrangerVoice = Number(postdata.ParameterStrangerVoice);
            postdata.ParameterLightSwitch = Number(postdata.ParameterLightSwitch);
            postdata.ParameterBrightness = Number(postdata.ParameterBrightness);
            postdata.ParameterExposure = Number(postdata.ParameterExposure);
            postdata.ParameterLanguageChoose = Number(postdata.ParameterLanguageChoose);
            postdata.ParameterPreview = Number(postdata.ParameterPreview);
            postdata.ParameterFaceIRThreshold = Number(postdata.ParameterFaceIRThreshold);
            postdata.ParameterDistance = Number(postdata.ParameterDistance);
            postdata.ParameterFaceThreshold = Number(postdata.ParameterFaceThreshold);
            postdata.ParameterMaskThreshold = Number(postdata.ParameterMaskThreshold);
            postdata.ParameterCompensate = Number(postdata.ParameterCompensate);
            postdata.ParameterTempThresholdMax = Number(postdata.ParameterTempThresholdMax);
            postdata.ParameterPolling = Number(postdata.ParameterPolling);
            postdata.ParameterAccessType = Number(postdata.ParameterAccessType);
            postdata.ParameterWgFormat = Number(postdata.ParameterWgFormat);
            postdata.ParameterKeepOpenDoor = Number(postdata.ParameterKeepOpenDoor);
            postdata.ParameterRecgInterval = Number(postdata.ParameterRecgInterval);
            postdata.ParameterDoorSensorDelay = Number(postdata.ParameterDoorSensorDelay);
            postdata.ParameterSaveExternalvisitors = Number(postdata.ParameterSaveExternalvisitors);
            postdata.ParameterSavePicture = Number(postdata.ParameterSavePicture);
            postdata.ParameterTempSwitch = Number(postdata.ParameterTempSwitch);
            postdata.ParameterFahrenheitSwitch = Number(postdata.ParameterFahrenheitSwitch);
            postdata.ParameterServerProtocol = Number(postdata.ParameterServerProtocol);
            postdata.ParameterUDPPort = Number(postdata.ParameterUDPPort);
            postdata.TimeZone = Number(postdata.TimeZone);
            
            postdata.ParameterIR = postdata.ParameterIR == "1" ? 1 : 0;
            postdata.ParameterMask = postdata.ParameterMask == "1" ? 1 : 0;
            postdata.ParameterLaissezSwitch = postdata.ParameterLaissezSwitch == "1" ? 1 : 0;
            postdata.ParameterIntervalRecoSwitch = postdata.ParameterIntervalRecoSwitch == "1" ? 1 : 0;
            postdata.ParameterDoorLongOpenAlarmSwitch = postdata.ParameterDoorLongOpenAlarmSwitch == "1" ? 1 : 0;
            postdata.ParameterDoorAlarmSwitch = postdata.ParameterDoorAlarmSwitch == "1" ? 1 : 0;
            postdata.ParameterEnableWeb = postdata.ParameterEnableWeb == "1" ? 1 : 0;
            postdata.ParameterEnableTelnet = postdata.ParameterEnableTelnet == "1" ? 1 : 0;
            postdata.ParameterEnableUDP = postdata.ParameterEnableUDP == "1" ? 1 : 0;
            postdata.ParameterHttpPostUseGZIP = postdata.ParameterHttpPostUseGZIP == "1" ? 1 : 0;
            postdata.ParameterFireAlarm = postdata.ParameterFireAlarm == "1" ? 1 : 0;

            
            
            //console.log(postdata);
            if (currentDevice.DeviceID != postdata.DeviceID) {
                postdata.ParameterSerialNum = postdata.DeviceID;
            }
            else {
                postdata.ParameterSerialNum = currentDevice.ParameterSerialNum;
            }
            delete postdata.softUpload;
            


            var sDetail = JSON.stringify(postdata, null, "\t");//序列化为字符串


            layer.confirm(getLanguage('DeviceInfo.d22'), { icon: 3 }, function (index, layero, that) {//'确定保存设备信息吗?'
                layer.close(index)


                var post = {
                    Protocol: faceAPI.DeviceDefaultPageType,
                    DefaultJson: sDetail
                };

                faceAPI.AjaxPOSTJson({
                    data: post,
                    url: '/api/Device/SetDefaultValue',
                    success: function (result) {

                        if (result.Result == false) {
                            layer.alert(result.Error, { icon: 2 });
                        }
                        else {
                            layer.close(parentIndex);
                        }
                    }
                });

            });
            return false;
        });


        faceAPI.ShowMouseTipMessageBox("device_Update_div_filter", layer);
        faceAPI.CheckInputBox();

    });
</script>
