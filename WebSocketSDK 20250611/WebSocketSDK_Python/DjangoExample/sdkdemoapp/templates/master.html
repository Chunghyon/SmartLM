{% load static %}
<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="{% static 'css/site.css' %}">
    <link rel="stylesheet" href="{% static 'lib/bootstrap/css/bootstrap.css' %}">
    <title>{% block title %}{% endblock %}</title>
    {% block header %}{% endblock %}
</head>
<body>
    <script src="{% static 'lib/bootstrap/js/bootstrap.bundle.js' %}"></script>
    <script src="{% static 'lib/jquery/jquery-3.7.1.min.js' %}"></script>

    <header>
        <nav class="navbar navbar-expand-sm navbar-toggleable-sm navbar-light bg-white border-bottom box-shadow mb-3">
            <div class="container">
                <a class="navbar-brand" href="{% url 'index' %}">Web SDK Demo App</a>
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target=".navbar-collapse" aria-controls="navbarSupportedContent"
                        aria-expanded="false" aria-label="Toggle navigation">
                    <span class="navbar-toggler-icon"></span>
                </button>

                <div class="navbar-collapse collapse d-sm-inline-flex justify-content-between">
                    <ul class="navbar-nav flex-grow-1">
                        <li class="nav-item">
                            <a class="nav-link text-dark" href="{% url 'online_devices' %}">Online Devices</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link text-dark" href="{% url 'manage_firmware' %}">Firmware Binaries</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link text-dark" href="{% url 'search_attend_logs' %}">Attendance Logs</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link text-dark" href="{% url 'search_management_logs' %}">Management Logs</a>
                        </li>
                    </ul>
                </div>
            </div>
        </nav>
    </header>

    <div class="container">
        <main role="main" class="pb-3">
            {% block content %}
            {% endblock %}
        </main>
    </div>

    <footer class="border-top footer text-muted">
        <div class="container">
            &copy; 2025
        </div>
    </footer>

</body>
</html>
